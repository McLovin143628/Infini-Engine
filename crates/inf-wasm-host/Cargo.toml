[package]
name = "inf-wasm-host"
description = "Sandboxed WASM mod runtime (wasmtime) with a capability-scoped, deny-by-default host API (P14.5)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# wasmtime = the sandbox. Apache-2.0 WITH LLVM-exception (+ its cranelift/wasmparser/
# regalloc2 tree, all Apache-2.0-WITH-LLVM-exception or MIT/Apache) — all on the
# deny allow-list. default-features off keeps the surface tight: the JIT
# (`cranelift`), the runtime, `std`, and `wat` (so tests can build tiny modules
# from text without a wasm toolchain). No component-model / async / WASI — a mod is
# a plain core module behind our own hand-rolled i64/f64 host ABI.
wasmtime = { workspace = true }
wat = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
