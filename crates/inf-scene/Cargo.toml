[package]
name = "inf-scene"
description = "Scene model: .inf_lvl format, transform hierarchy, .inf_act prefab instantiation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The runtime `.inf_lvl` reader decodes into the SAME `inf-ecs` component types
# the editor's authoring codec writes, so bytes round-trip field-for-field.
inf-ecs = { workspace = true }
# The frozen pre-v9 `TerrainV8` record names `TerrainData` directly (schema v9
# froze `Terrain`'s layout when it gained its `.inf_terrain` asset reference).
inf-terrain = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
