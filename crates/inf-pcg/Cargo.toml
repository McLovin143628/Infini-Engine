[package]
name = "inf-pcg"
description = "Procedural content generation runtime: samplers, rules, GPU-instanced scattering."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The Ring-0 compute job system (§2.5): scatter is a named hot loop parallelized
# deterministically via `parallel_map` over cells.
inf-core = { workspace = true }
# The terrain heightfield seam: `inf_terrain::HeightSource` bridges to this
# crate's `HeightProvider` (see the blanket impl in `height.rs`), so a real
# `TerrainData` can drive scatter.
inf-terrain = { workspace = true }
# f64 world coordinates (DVec3) + orientations (DQuat) — architecture rule 3.
glam = { workspace = true }
serde = { workspace = true }
# The editor graph is embedded in the `.inf_pcg` payload as a JSON string (the
# `inf-graph` model's `skip_serializing_if` fields are not bincode-safe).
serde_json = { workspace = true }
# Deterministic, byte-identical `.inf_pcg` payload encoding.
bincode = { workspace = true }
# The dual-format asset rule: `AssetKind::Pcg` + `AssetPayload` for the `.inf_pcg`
# document (one encode/decode code path across the engine).
inf-asset = { workspace = true }
# The shared node-graph substrate (P10.5b editor kit): the `.inf_pcg` editor
# authors a DAG over `inf-graph` (same substrate as Blueprints/materials); the
# graph is the on-disk source of truth and `lower_graph` targets `PcgDocument`.
inf-graph = { workspace = true }
# Mesh asset references on a PCG kind (raw GUID) + the asset id/kind types.
uuid = { workspace = true }
thiserror = { workspace = true }


[dev-dependencies]
# The permanent round-trip discipline: every `SamplerDef` shape a graph can lower
# to must survive both codecs and re-encode byte-identically. Property-generated
# rather than enumerated, because the tree is recursive and the failure mode
# (a shifted discriminant, a variant nobody wrote a case for) is exactly the kind
# a hand-written corpus misses.
proptest = { workspace = true }
