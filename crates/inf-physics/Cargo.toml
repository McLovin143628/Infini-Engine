[package]
name = "inf-physics"
description = "Physics facade over rapier2d-f64 (2D) / rapier3d-f64 (3D, later). Fixed-step, deterministic, Ring 0."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The 2D physics engine (f64 build). See the workspace-dependency comment for the
# f64 + enhanced-determinism + no-`parallel` rationale. rapier's math types are
# glam 0.33 (== our workspace pin), so the facade speaks `glam::DVec2` natively.
rapier2d-f64 = { workspace = true }
# The 3D physics engine (f64 build), the d3 sibling of rapier2d-f64. Same
# f64 + enhanced-determinism + no-`parallel` rationale; math types are glam 0.33
# so the facade speaks `glam::DVec3` / `glam::DQuat` natively.
rapier3d-f64 = { workspace = true }
# parry3d-f64 (P22.2): rapier's own geometry library, already in the tree beneath
# rapier3d-f64 and pinned once in `[workspace.dependencies]` (see the rationale
# there). Named here — and ONLY here in the whole workspace — so the
# `ColliderShape3D::ConvexHull` variant can state its refusal in parry's own
# terms (`ConvexPolyhedron::from_convex_hull` returning `None`) and report the
# hull's volume from the SAME mass properties the solver will integrate, rather
# than from a second hand-written volume formula that could drift from it. The
# P20.2 precedent: buoyancy reads its displaced volume off rapier's own mass
# properties for exactly this reason.
parry3d-f64 = { workspace = true }
glam = { workspace = true }
# The ECS↔physics bridge (`d2::ecs`) reads scene components to build bodies.
# Dependency direction is inf-physics → inf-ecs (both Ring 0); inf-ecs never
# names physics, so there is no cycle.
inf-ecs = { workspace = true }
# P29.4: the animation half of the character bridge -- the warp primitive a
# mantle is placed by, the foot-lock rule, the ragdoll's motor drive and the
# root-motion track a machine-driven character consumes. Ring 0 -> Ring 0, the
# same direction inf-ecs already takes, and inf-anim names no physics so there is
# no cycle. Here rather than in inf-ecs because the CONSUMER is the fixed step in
# `d3::movement`, and a rule lives once beside the thing that calls it.
inf-anim = { workspace = true }
# P20.2: the water height query the buoyancy pass samples in the fixed step.
# Ring 0 → Ring 0, and deliberately the SAME crate `inf-render` consumes, so the
# surface a boat floats on and the surface the shader draws are one evaluator —
# the terrain-parity class of drift, avoided by not creating a second copy.
inf-water = { workspace = true }
# P21.4: the sim's voxel volumes, meshed into static trimesh colliders so a
# runtime carve is something a body can fall into. Ring 0 → Ring 0, and
# deliberately the SAME mesher the renderer draws with (`inf_voxel::mesh_chunk`) —
# a second surface-extraction here would be the class of drift the water crate's
# comment above names, with the added charm of being invisible until a player
# clips through a cave wall.
inf-voxel = { workspace = true }
# P22.3: the terrain tile grid + its per-sample hole mask, so a sim-resident tile
# becomes a static height-field collider and a body can stand on the ground at
# all. Named directly rather than reached through `inf-ecs`'s re-export because
# the gather needs `TileKey` and `TerrainData`'s residency/version ledger, not
# just the component — and because the crate this reads the HOLE RULE from must
# be the crate that defines it (`TerrainData::height_at`'s poison rule), so the
# collider's gap and the query's gap cannot drift apart. Ring 0 → Ring 0; the
# same crate `inf-render` and both hosts already consume.
inf-terrain = { workspace = true }
# P22.3: the `.inf_fracture` chunk set — hull point sets, volumes, centres of
# mass and the chunk-indexed adjacency graph — that a `FractureState` is built
# from. Named directly, on the same rule the four dependencies above are: the
# structural solve reads the SAME `FractureAsset` the cook wrote and the render
# projector draws, so there is no second copy of a chunk's adjacency to drift
# from it (the `GpuLight` triplication law). A facade-local mirror of
# `FractureChunk` would be exactly that second copy, and would have to be kept in
# step with a container that has its own version ladder. Ring 0 → Ring 0; the
# direction is inf-physics → inf-mesh and inf-mesh never names physics, so there
# is no cycle. (inf-mesh's own `convex_hull_is_buildable` producer gate already
# points the other way at *dev*-dependency strength, in the packager.)
inf-mesh = { workspace = true }
# The spline interpolation kind a river centreline is built with. Named directly
# rather than reached through `inf-ecs` because the ECS `SplineInterp` is the
# *authoring* enum and `inf_math`'s is the *math* one — the mapping between them
# is the projection, and hiding one behind the other would hide that.
inf-math = { workspace = true }
# Entity identity (Guid) keys the deterministic entity↔handle maps.
uuid = { workspace = true }
# P22.3 (re-audit): the one place this crate reports rather than refuses — a
# fracture asset with a one-sided adjacency edge is a tolerated INPUT (the reader
# canonicalises it), so it warns instead of panicking. A `debug_assert` there was
# a debug-only hard failure on an asset release priced correctly.
tracing = { workspace = true }

[dev-dependencies]
# P19.5: pins `inf_ecs::ScatteredSolid` against its `inf_pcg::PcgCollider` mirror.
# Two hand-written copies of one struct is a triplication hazard, so a test
# converts both ways. Dev-only — the bridge reads the ECS side and never names
# the PCG one, so the dependency direction stays inf-physics → inf-ecs.
inf-pcg = { workspace = true }
# P22.3: `AssetId`, so the fracture suite can run the REAL cook derivation
# (`fracture_mesh`) against its hand-built fixtures. Dev-only — the bridge never
# names an asset id, because a `FractureState` arrives already resolved.
inf-asset = { workspace = true }
