[package]
name = "inf-audio"
description = "Audio facade over kira: engine-side bus/volume model + spatial attenuation, no-device fallback. Ring 0."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# One warn-once line when a `Play` names a clip that will not resolve (hardening
# wave B / C4-43). Workspace pin, already in the tree — no new external crate.
tracing = { workspace = true }
# kira supplies StaticSoundData decoding (symphonia) + the mixer/handle types.
# The workspace pin has default-features off (symphonia decoders only, no device
# backend). The real cpal output backend is pulled in only by our `cpal` feature
# below — see the workspace-dependency comment for the Linux-ALSA/CI rationale.
kira = { workspace = true }
# Engine vocabulary: listener/emitter poses are `glam::DVec3` (the f64 world).
glam = { workspace = true }
# The `.inf_audio` asset payload (P12.3) is an `inf_asset::AssetPayload`, mirroring
# inf-mesh's `MeshAsset` — the dual-format bincode-payload + TOML-sidecar rule.
inf-asset = { workspace = true }
# MixerConfig + AudioImportSettings + AudioAsset are serde types; the mixer config
# persists as deterministic TOML at `.infinity/mixer.toml`.
serde = { workspace = true }
toml = { workspace = true }
# Audio-clip GUIDs on the command queue + asset refs are `uuid::Uuid`.
uuid = { workspace = true }

[features]
# Off by default: the default build decodes sound + runs the deterministic no-device
# path (what CI + tests exercise). The desktop runtime enables `cpal` to open a real
# audio device (WASAPI/CoreAudio/ALSA); if no device is present the engine still
# falls back to the same no-op path, so enabling it never breaks a headless run.
default = []
cpal = ["kira/cpal", "kira/cpal-realtime"]
