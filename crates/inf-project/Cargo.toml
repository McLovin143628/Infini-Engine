[package]
name = "inf-project"
description = "Project model: inf.toml manifest, project templates + scaffolding, recent-projects list."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The one atomic-write door (`inf_asset::write_atomically`). A Ring-0 -> Ring-0
# edge, and free of weight in practice: every consumer of this crate
# (inf-cli, inf-packager, inf-player, the studio) already links `inf-asset`,
# and `inf-asset` has no edge back here, so there is no cycle. The alternative
# was a second copy of the temp+rename law in a crate that writes the file a
# project cannot be opened without.
inf-asset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# **A dev-dependency only.** The template ships an example `.infini`, and a
# scaffolded script that does not compile is a broken first impression the
# template's own arm has to catch. Scaffolding still names a *path*, not a
# crate — `include_str!` — so nothing about this crate's shipped dependency
# graph moves.
inf-script = { workspace = true }
