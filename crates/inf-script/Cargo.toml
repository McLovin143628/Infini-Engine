[package]
name = "inf-script"
description = "InfiniScript: the .infini text face on the Infini Blueprints IR — lexer, parser, lowering and emitter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# **Zero new external dependencies, by rule** (the SCRIPT1 brief). The lexer and
# the parser are hand-rolled — the precedents are `inf-pcg`'s grammar DSL and
# `inf-anim`'s `.inf_sm` text face — because a parser generator is a build-time
# dependency for a grammar that fits in one file, and because the whole reason
# InfiniScript is not Luau is that this engine does not take a foreign runtime
# into its fixed step.
[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
inf-blueprint = { workspace = true }
inf-graph = { workspace = true }

[dev-dependencies]
inf-math = { workspace = true }
# Already a workspace dependency (with `float_roundtrip`); used only by the
# determinism gate, to get canonical bytes to digest.
serde_json = { workspace = true }
# The third leg of the round trip (text -> IR -> Rust -> IR). A dev-dep only:
# the compiler does not depend on the transpiler, and must not.
inf-transpile = { workspace = true }
# The file door's gate writes real files: an unreadable one, an over-long one,
# and one holding a byte sequence that is not UTF-8.
tempfile = { workspace = true }
