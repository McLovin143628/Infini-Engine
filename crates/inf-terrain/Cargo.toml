[package]
name = "inf-terrain"
description = "Terrain: paged f64 heightfield, clipmap LOD source, heightmap import/export."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
# The BIT-PORTABLE trigonometry (`psin64`/`pcos64`) the thermal-erosion talus
# threshold goes through. `f64::tan` is a libm call and libm is not bit-identical
# across targets (the P14 law); eroded terrain is DATA — it is written back into
# an `.inf_terrain`, cooked into a pack and shipped — so a bake on one machine and
# a bake on another must not produce two different worlds. Ring-0 → Ring-0, and
# `inf-math` names nothing but glam, so no cycle and no new external crate.
inf-math = { workspace = true }
# The `.inf_terrain` streaming asset (P16.3): `AssetKind`/`AssetPayload` + the
# dual-format rule. Ring-0 → Ring-0 (inf-asset never names terrain, so no cycle).
inf-asset = { workspace = true }
# The engine job pool (P16.3b2 streaming): a render-wants load batch decodes its
# tiles through `parallel_map_ref` — the deterministic in-order pure map — so the
# batch is parallel without becoming timing-dependent. Ring-0 → Ring-0.
inf-core = { workspace = true }
# Per-tile blobs inside the `.inf_terrain` payload are the SAME deterministic
# bincode a tile writes into an `.inf_lvl`, so the two persistence paths agree
# byte-for-byte. Promoted from dev-dependencies at P16.3.
bincode = { workspace = true }
# PNG16 heightmap ENCODE (the export path) still goes through `image`'s one-shot
# DynamicImage writer.
image = { workspace = true }
# P16.4 chunked import: the DECODE path is row-at-a-time, so it reaches for the
# codecs directly rather than `image`'s whole-image `DynamicImage`.
#   png  — `Reader::next_row`, one row per call (already in the tree; the
#          workspace pin is the same crate `image` uses one major behind).
#   exr  — `block::read(..).decompress_sequential(..)`, one decompressed scanline
#          block at a time. Already in the tree via `image`'s `exr` feature, so
#          this pins no new crate; BSD-3-Clause, on the deny allow-list.
#   half — the `f16` sample type an EXR line may carry (in-tree via exr).
#   tiff — GeoTIFF, the format real elevation data ships in (Wave G).
#          `read_chunk` + `chunk_dimensions` is the SAME chunk-at-a-time seam
#          the other two give us, so the P16.4a memory bound (a 16k source
#          imports in ~100 MB, not 1 GB) survives the new format rather than
#          being re-argued for it. This is the one place `tiff` is named — it
#          belongs beside its sibling decoders, not behind inf-gis's facade,
#          because a DEM is an elevation source and not a vector source. MIT.
png = { workspace = true }
exr = { workspace = true }
tiff = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
# The `.inf_biomes` BiomeSet (P19.2) carries a PCG-graph asset reference per biome
# (the P19.3 hook), so the crate now names GUIDs directly rather than smuggling
# them as `[u8; 16]`. Ring-0 → a leaf data crate; already the workspace pin.
uuid = { workspace = true }
# Streaming diagnostics: a page that fails to decode is warned about, never
# silently turned into geometry.
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Byte-identity checks: xxh3 a terrain's tiles before/after an undo round-trip.
xxhash-rust = { workspace = true }
# The `.inf_terrain` round trip through a real cooked pack (P16.3): build a pack
# on disk, `PackReader::open` it, and slice tiles out of the mapping.
tempfile = { workspace = true }
