[package]
name = "inf-material"
description = "Materials: material model, .inf_mat graph to WGSL codegen, .inf_tex compute graphs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
inf-asset = { workspace = true }
inf-graph = { workspace = true }
# P26.2: the virtual address space the `.inf_tex` v2 container addresses tiles in
# — `TileCoord` lives there and is re-exported here, and `TiledTextureReader`
# hands a residency its `VtTextureDesc`. The direction is deliberate: `inf-vt`
# must never name THIS crate, because a shipped player samples virtual textures
# and must not link `image` + `naga` to do it. See `inf_vt`'s crate docs.
inf-vt = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
# Wave T: the RGBA16F storage format an EXR/Radiance source keeps its dynamic
# range in. **Not a new dependency** — `half` has been pinned in
# `[workspace.dependencies]` and linked by `inf-terrain` since P16; this is one
# more member crate naming a version that already lives once. It rides on the
# importer side only: `inf-material` is a *dev* dependency of `inf-render`, so
# the shipped player still links no half-float code to sample one.
half = { workspace = true }
# Author-time validation of graph-generated WGSL (P7.2).
naga = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
