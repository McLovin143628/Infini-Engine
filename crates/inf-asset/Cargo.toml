[package]
name = "inf-asset"
description = "Asset system: .inf_* schemas, bincode payload + TOML sidecars, GUIDs, asset DB, importers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Native/desktop: the `notify` file watcher (asset DB live rescans) and the C
# `zstd` codec (pack encode + decode). Neither targets `wasm32-unknown-unknown`
# (notify has no browser backend; zstd-sys's C build won't cross-compile), so
# they are host-only. The wasm player never watches files and never cooks packs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
zstd = { workspace = true }

# Web (P14.2): the browser player must DECODE fetched packs; ruzstd is the
# pure-Rust zstd decoder that builds for wasm (encode stays host-only).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
