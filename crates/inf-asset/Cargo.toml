[package]
name = "inf-asset"
description = "Asset system: .inf_* schemas, bincode payload + TOML sidecars, GUIDs, asset DB, importers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# IASSET1 per-block codecs (`crate::block`). Pure Rust, so they build for every
# target this engine ships to — including wasm32, where the streaming containers
# have to decode their blocks with no C toolchain behind them. Unlike `zstd`
# below they are therefore NOT host-only.
lz4_flex = { workspace = true }
miniz_oxide = { workspace = true }

# Native/desktop: the `notify` file watcher (asset DB live rescans), the C
# `zstd` codec (pack encode + decode), and `memmap2` (zero-copy pack reads, P16.1).
# None targets `wasm32-unknown-unknown` (notify has no browser backend; zstd-sys's
# C build won't cross-compile; a browser has no address space to map a file into),
# so they are host-only. The wasm player never watches files, never cooks packs,
# and reads packs it fetched over HTTP as owned bytes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
zstd = { workspace = true }
memmap2 = { workspace = true }

# Web (P14.2): the browser player must DECODE fetched packs; ruzstd is the
# pure-Rust zstd decoder that builds for wasm (encode stays host-only).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
