[package]
name = "inf-vt"
description = "Streaming virtual texturing: the virtual address space, the physical page pool and its residency (GPU-free)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Deliberately the SHORTEST dependency list in the workspace, and the shape of it
# is load-bearing rather than frugal — see the crate docs. `inf-vt` names no
# asset crate, no math crate and above all no `wgpu`: it is the bookkeeping half
# of virtual texturing, unit-testable with no adapter on every CI leg.
#
# `tracing` is NOT here, and the P26.2 audit took it back out: nothing in this
# crate logs. Every refusal is a typed `VtError`, every warning a returned
# `VtAdvisory`, and every count a field of `VtStats` — the advisories are handed
# back rather than logged precisely so a host decides whether they are a warning,
# a fatal, or a line in an import report. A dependency nothing reaches for is
# weight, and here it would also have been a claim the crate did not honour.
# P28.3: the ONE streamer's arbitration half — the stamp domain this crate's
# residency draws from, the lane order its `apply_wants` admits in, and the
# `SlotPool` trait it implements. It is the only crate `inf-vt` names, and the
# rule above survives intact: `inf-stream` is this crate's own dependency list
# (thiserror, nothing else) and names no consumer, so nothing new reaches the
# shipped player through it.
inf-stream = { workspace = true }
thiserror = { workspace = true }
