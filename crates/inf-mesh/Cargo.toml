[package]
name = "inf-mesh"
description = "Mesh import processing and optimization; later home of the meshlet builder."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
inf-asset = { workspace = true }
inf-anim = { workspace = true }
serde = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
gltf = { workspace = true }
meshopt = { workspace = true }
# Decode `map_Kd` sidecar textures for OBJ import → RGBA8 `RawImage` (the glTF
# path gets decoded images from the `gltf` crate; OBJ references loose files).
# Workspace pin — no new version enters the tree (already used by inf-material).
image = { workspace = true }
# Asset GUIDs: the fracture pipeline derives its `.inf_fracture` id from the
# mesh's (`fracture::derived_fracture_id`) and stamps the source GUID into the
# payload. Workspace pin; `inf-asset` already has it in the tree.
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
