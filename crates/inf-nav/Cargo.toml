[package]
name = "inf-nav"
description = "Navigation: a deterministic weighted graph, Dijkstra routes as values, and arc-length paths (pure f64, bit-portable)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# **glam and nothing else**, which is a stronger claim than the one this file
# made until the NPC1c audit: it declared `inf-math` "the bit-portable trig a
# heading is taken with" and no line in the crate ever named it. There is no
# trigonometry here to route — a cost is `+ - * / sqrt` and a heading is a
# normalize — so the dependency was an unused edge under a sentence that read
# like a determinism guarantee. The guarantee is real and it comes from the
# arithmetic, not from an import; `crates/inf-anim/tests/portable_pose.rs` bans
# every `std` transcendental in all three files and is what enforces it.
glam = { workspace = true }
