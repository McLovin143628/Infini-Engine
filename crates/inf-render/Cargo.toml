[package]
name = "inf-render"
description = "Renderer: wgpu device/surface, render graph, WGSL pipeline cache, GPU-driven draws, ID picking."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
inf-math = { workspace = true }
# P20.1: the DERIVED Gerstner parameters (`inf_water::Wave`/`WaveField`) and the
# river frames a projector hands the water pass. Ring-0 → Ring-0, and pure math:
# the renderer never re-derives a wave, it only evaluates the sum it is given.
# That is what stops a second, f32, platform-dependent copy of the wave model
# existing in WGSL beside the one P20.2's buoyancy samples.
inf-water = { workspace = true }
inf-render-2d = { workspace = true }
# Virtualized geometry (P13.1b GPU meshlet path): the renderer uploads a
# `VgeomMesh` (meshlet DAG) into storage buffers and culls/selects on the GPU.
# Ring 0 → Ring 0; the shipping renderer consumes the cook-derived data model.
inf-vgeom = { workspace = true }
# Virtual texturing's GPU-free half (P26.2): the renderer's `vt` module is the
# MIRROR — it owns one atlas texture and one indirection buffer and does nothing
# but execute an `inf_vt::VtTransaction`. Ring 0 → Ring 0, and cheap: `inf-vt`
# depends on thiserror and nothing else. Note which crate this is NOT:
# `inf-material` (the container that writes the tiles) is a DEV dependency
# below, and `inf-vt` deliberately does not name it either, so binding VT into
# the lit passes at P26.3 cannot drag `image` + `naga` into a shipped player.
# P26.4: the deterministic in-order job pool. The virtual-texture streamer
# stages a transaction's pages through `parallel_map_ref` — which is real work
# on the transcode tier (a BC decode per page) and free on the BC tier (a slice
# of an mmap) — exactly as `inf_vgeom::stream` and terrain's B2 load batch
# already do. Also the §8 composed-frame budget constant. Not a new external
# dependency and not a new one in any shipped tree: `inf-terrain`, `inf-vgeom`
# and `inf-player` all name `inf-core` already.
inf-core = { workspace = true }
inf-vt = { workspace = true }
# Virtual shadow mapping's GPU-free half (P27.1): the renderer's `vsm_atlas`
# module is the MIRROR — it owns one `Depth32Float` page atlas and one
# indirection buffer and does nothing but execute an `inf_vsm::VsmTransaction`.
# Ring 0 -> Ring 0, and cheap on the same terms as `inf-vt`: thiserror and
# nothing else. The two do not name each other; see `inf-vsm`'s crate docs for
# the measurement that kept them apart, and P28.3 for where the brains merge.
inf-vsm = { workspace = true }
# The ONE virtual streamer (P28.3): the budget arbiter the three page systems'
# ceilings are divided by, the lane vocabulary their want sets are ordered in,
# the coupling that keeps a cluster page and its texture tiles aging together,
# and the readback ledger the two feedback rings report into. Ring 0, thiserror
# and nothing else, and it names none of the three consumers — this crate is
# where the three meet, which is why it is the one that reads all four.
inf-stream = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
# Content-addressed scatter batch keys (P18.5): `ScatterData::build` folds an
# xxh3-128 over the packed instance bytes as it packs, so a GPU upload is keyed by
# what it contains rather than by who asked for it — the P18.3 derived-vmesh id
# discipline, applied to a payload that is rebuilt on every projection.
xxhash-rust = { workspace = true }

[dev-dependencies]
# P22.1: the `golden_deform` scene presses its footprints with the REAL Ring-0
# field (`inf_terrain::deform`) and then projects it exactly as the two hosts do,
# so the golden exercises the shipped path end to end rather than a hand-written
# depth buffer that could agree with nothing. DEV-ONLY — `inf-render` must never
# depend on `inf-terrain` at build time (`RenderTerrain` is deliberately
# self-contained rather than naming it), and this is the same arrangement
# `inf-voxel` below already has. No cycle: `inf-terrain` names no renderer type.
inf-terrain = { workspace = true }
# P21.1: the `golden_voxel` scene is meshed by the REAL Surface-Nets mesher
# rather than by a hand-written triangle soup, so the golden exercises the
# shipped path end to end. DEV-ONLY — `inf-render` must never depend on
# `inf-voxel` at build time (the DTOs are deliberately self-contained triangle
# soup, exactly as `RenderTerrain` is self-contained rather than naming
# `inf-terrain`). There is no cycle: `inf-voxel` names no renderer type.
inf-voxel = { workspace = true }
png = { workspace = true }
# The vgeom suites (goldens, occlusion, streaming, frame budget) all drive the
# SAME displaced-grid fixture; it lives once in `inf_vgeom::test_support`, behind
# this test-only feature, with bit-portable trig (the P14 LAW — `std` sin/cos
# cooked a different meshlet DAG on macOS than on Windows). Dev-only, so the
# shipping renderer's `inf-vgeom` is unchanged.
inf-vgeom = { workspace = true, features = ["test-support"] }
# Validates every composed WGSL variant (scene_shader / lit_scene_shader ×
# each pass source) without a GPU — the pick-shader composition regression gate.
naga = { workspace = true }
# P26.1: the BC-upload proof builds a REAL `.inf_tex` v2 tiled container and
# uploads one of its tiles, rather than a hand-written block soup that could
# agree with nothing. DEV-ONLY — the shipping renderer must not depend on the
# material/import crate (Ring 0 discipline, and `inf-material` pulls `image` +
# `naga`); the residency door that will page these tiles for real is `inf-vt` in
# P26.2. No cycle: `inf-material` names no renderer type.
inf-material = { workspace = true }
# P28.2: the cluster-page invariant gate names a `.inf_tex` by its ASSET ID,
# because that is what a `ClusterTileRef` carries — one spelling of a texture's
# identity across the container, the cook and the residency. DEV-ONLY: the
# shipping renderer keys textures by `u128` and never names the asset crate.
inf-asset = { workspace = true }
uuid = { workspace = true }
# Drives the skinned golden from a real clip (pose eval → skinning palette).
# Dev-only: keeps the shipping renderer free of an anim dependency (Ring 0
# discipline) while proving the GPU-skinning path against inf-anim end to end.
inf-anim = { workspace = true }
