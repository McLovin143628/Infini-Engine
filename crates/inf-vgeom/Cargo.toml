[package]
name = "inf-vgeom"
description = "Virtualized geometry (Phase 13): meshlet DAG, streaming, GPU occlusion culling."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Ring-0 asset dual-format rule: VgeomMesh is an AssetPayload (`.inf_vmesh`).
inf-asset = { workspace = true }
# The Ring-0 compute job system — per-group simplification is a named parallel hot
# loop (§2.5); parallel_map's deterministic in-order collect keeps the build
# reproducible regardless of pool size.
inf-core = { workspace = true }
serde = { workspace = true }
# The `.inf_vmesh` v2 container (P18.2) holds its DAG groups as one bincode
# section beside the raw, 16-byte-aligned meshlet pages — the same encoder the
# rest of the asset system uses, so the section is byte-deterministic.
bincode = { workspace = true }
bytemuck = { workspace = true }
# `derived_vmesh_id` (P18.3): the one place the `.inf_mesh` → `.inf_vmesh` id
# bijection is defined, so the cook, the player and the editor cannot disagree.
uuid = { workspace = true }
# P28.2: a cluster page carries the virtual-texture tiles its materials sample,
# so the container has to be able to NAME a tile. It names it in `inf-vt`'s own
# spelling (`TileCoord`, `VtTextureDesc`) rather than minting a second one — the
# P28.1 law that one quantity gets one conversion function, applied to an
# address. The edge is free of weight and free of cycles: `inf-vt` is the
# shortest dependency list in the workspace (thiserror, nothing else) and names
# no geometry crate, so it stays strictly below this one.
inf-vt = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Bit-portable trig for the SHARED FIXTURE MESHES (`test_support`, behind the
# `test-support` feature). The P14 LAW: f32 std `sin`/`cos` differ in the low bits
# between MSVC's CRT, glibc and Apple's libm, so a fixture displaced with them
# cooks a different meshlet DAG per platform — which is what two macOS-only CI
# failures actually were. Optional: it is pulled in ONLY by that test-only
# feature, so a shipping vgeom build is unchanged.
inf-math = { workspace = true, optional = true }

[features]
# Exposes `test_support` (the shared fixture meshes) to OTHER crates' test
# targets — `inf-render`, `inf-player` and this crate's own `tests/` all switch it
# on from their DEV-dependencies. Never enable it in a shipping build.
test-support = ["dep:inf-math"]

# meshoptimizer: clusterization (build_meshlets), simplification with border locks
# (simplify_with_locks), and cluster bounds/cones. Already pinned once in the
# workspace for inf-mesh's import path; additive here. It builds meshoptimizer's
# C++ via `cc`, which needs a C++ toolchain — so it is HOST-ONLY: the meshlet DAG
# is BUILT at cook time (the `build` module), never in the browser player, which
# only LOADS pre-cooked `.inf_vmesh` DAGs. Gating it out keeps the wasm player
# free of any C/C++ toolchain requirement (P14.2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = { workspace = true }

[dev-dependencies]
inf-asset = { workspace = true }
# `test_support` is compiled for this crate's own `cfg(test)` unit tests too, and
# `cfg(test)` does not turn a feature on — so the portable-trig dep has to be
# reachable as a dev-dependency as well.
inf-math = { workspace = true }
# This crate's INTEGRATION tests (`tests/`) link the lib from OUTSIDE, so a
# `cfg(test)`-only module is invisible to them; they used to carry a hand-copied
# fixture generator for exactly that reason. A dev-dependency on self is the
# supported way to say "build my own lib with `test-support` on for my tests".
inf-vgeom = { path = ".", features = ["test-support"] }
