[package]
name = "inf-vgeom"
description = "Virtualized geometry (Phase 13): meshlet DAG, streaming, GPU occlusion culling."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Ring-0 asset dual-format rule: VgeomMesh is an AssetPayload (`.inf_vmesh`).
inf-asset = { workspace = true }
# The Ring-0 compute job system — per-group simplification is a named parallel hot
# loop (§2.5); parallel_map's deterministic in-order collect keeps the build
# reproducible regardless of pool size.
inf-core = { workspace = true }
serde = { workspace = true }
# The `.inf_vmesh` v2 container (P18.2) holds its DAG groups as one bincode
# section beside the raw, 16-byte-aligned meshlet pages — the same encoder the
# rest of the asset system uses, so the section is byte-deterministic.
bincode = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# meshoptimizer: clusterization (build_meshlets), simplification with border locks
# (simplify_with_locks), and cluster bounds/cones. Already pinned once in the
# workspace for inf-mesh's import path; additive here. It builds meshoptimizer's
# C++ via `cc`, which needs a C++ toolchain — so it is HOST-ONLY: the meshlet DAG
# is BUILT at cook time (the `build` module), never in the browser player, which
# only LOADS pre-cooked `.inf_vmesh` DAGs. Gating it out keeps the wasm player
# free of any C/C++ toolchain requirement (P14.2).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshopt = { workspace = true }

[dev-dependencies]
inf-asset = { workspace = true }
