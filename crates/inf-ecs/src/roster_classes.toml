# THE ROSTER'S CLASS DEFAULTS (wave VEH3f) -- the research doc's handling-profile
# table as data. A roster row that says `class = "coupe"` starts from the table
# below and then applies its own keys, so a row is only what makes it THAT car.
# Resolution order (VehicleDef::from_toml_table_with): defaults, then this class,
# then the row's spellings, then the row's numbers, then mass_kg/drag_coefficient.
# Generated by the VEH3f scratch gen_roster.py; every key is a VehicleDef geometry
# name or a VehicleTuning name, and an unknown one is refused BY NAME.

# Coupes and sports cars. The doc's handling profile: CoM LOW and CENTRAL, balanced
# damping, medium roll, HIGH peak traction with a SHARP slip curve, and a high-pitched
# four, six or eight.
[coupe.vehicle]
body = "coupe"
drivetrain = "rwd"
differential = "lsd"
travel_m = 0.17
rest_length_m = 0.42
lateral_grip = 1.45
longitudinal_grip = 1.5
tyre_lat_peak_slip = 0.12
tyre_long_peak_slip = 0.1
