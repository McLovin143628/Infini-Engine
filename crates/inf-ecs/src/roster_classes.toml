tyre_long_rise_bias = 0.8
tyre_slide_frac = 0.68
tyre_load_sensitivity = 0.18
cog_height_m = -0.3
anti_roll_front_n_per_m = 22000.0
anti_roll_rear_n_per_m = 20000.0
max_steer_deg = 34.0
min_steer_deg = 7.0
steer_rate_deg_per_s = 300.0
steer_return_deg_per_s = 400.0
ackermann = 0.9
abs_slip = 0.13
traction_control_slip = 0.16
stability_control = 0.25
rolling_resistance = 0.012
downforce_n_per_mps2 = 0.35
downforce_centre_z = -0.4
drag_lateral_n_per_mps2 = 1.1
brake_bias = 0.64
idle_rpm = 850.0
torque_curve_bias = 0.45
idle_torque_frac = 0.6
redline_torque_frac = 0.85
engine_brake_nm = 50.0
gear_count = 6.0
gear_1_ratio = 3.6
gear_2_ratio = 2.4
gear_3_ratio = 1.75
gear_4_ratio = 1.35
gear_5_ratio = 1.08
gear_6_ratio = 0.88
reverse_ratio = 3.4
shift_time_s = 0.15
flywheel_inertia_kgm2 = 0.14
wheel_inertia_kgm2 = 1.0
cylinders = 8.0
engine_voice_kind = 0.0
firing_order_variant = 0.0
enter_time_s = 0.62

