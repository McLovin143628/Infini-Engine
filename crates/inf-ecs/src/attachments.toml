# **THE ATTACHMENT CATALOGUE** (wave WPN2d) -- 530 rows, read by
# `inf_ecs::attachment::ATTACHMENTS_TOML` through `include_str!`, on
# `crates/inf-ecs/src/weapons.toml`'s own terms: a generated, byte-pinned table
# that reaches a running game through the SAME by-name doors the registry does
# and costs ZERO schema (nothing here derives `Serialize`).
#
# THE ROWS ARE THE USER'S RESEARCH DOC'S OWN LISTS
# (`docs/Weapons-in-Rust-based-Game-Engine-GTA-Game.md`, the modular-attachment
# chapter): ten attachments per category per class. The doc's ARs name a
# `Lasers` slot in their header and then never fill it, so the assault rifle has
# eight filled categories like every other rifle class and the honest total is
# **530**, not the 600 a header count would promise. Counted by
# `wpn2d_gate::the_attachment_catalogue_is_the_docs_own_lists`.
#
# THE TEN SLOTS ARE THE DOC'S OWN `AttachmentSlot` ENUM, verbatim, and several
# of the doc's per-class categories have no seat of their own in it. They take
# the seat of the part they physically ARE, which is stated here rather than
# left to a reader to infer:
#
#   Comb / Cheek Risers (DMR)      -> `stock`   -- a cheek piece IS the stock's
#                                                  top, and a DMR carries both
#                                                  lists, so `stock` holds 20.
#   Bolt Assemblies (sniper)       -> `trigger_action` -- a bolt IS the action.
#   Fire Control Units (launcher)  -> `trigger_action` -- likewise.
#   Warhead Types (launcher)       -> `ammunition` -- a warhead IS the round.
#   Stocks / Shoulder Pads         -> `stock`.
#   Barrel / Tube Shroud           -> `barrel`.
#   Stocks / Conversions (pistol)  -> `stock`.
#   Muzzles / Chokes (shotgun)     -> `muzzle`.
#   Magazine / Tube (shotgun)      -> `magazine`.
#
# THE ROW FORMAT is one pipe-separated string per attachment, because 530 rows
# of eleven-key TOML tables is 6 000 lines nobody reads and this is 530 lines
# anybody can diff:
#
#   id | label | damage | range | recoil | ads_ms | move | velocity | loudness | mag | art
#
# * `damage`/`range`/`recoil`/`move`/`velocity`/`loudness` are MULTIPLIERS on
#   the base `WeaponDef` (the doc's `StatModifiers`, which are multiplicative);
# * `ads_ms` is the doc's `ads_time_delta_ms`, an ADDITIVE delta in
#   milliseconds (a slower optic is `+`);
# * `loudness` is this engine's own eleventh field and it is what makes a
#   suppressor MEAN something: it multiplies the report's volume AND its
#   `report_max_m`, which are the two fields `inf_ecs::weapon::report_layers`
#   builds every gunshot command out of. The doc's `StatModifiers` has no
#   loudness because the doc's audio section is a separate chapter; a suppressor
#   that changed nothing audible would be a row with no reader.
# * `mag` is the doc's `mag_capacity_override`, or `-`;
# * `art` names the accessory MESH this attachment draws, one of
#   `scope` / `sight` / `suppressor` / `vertgrip` (the four `SM_*` in the FPS
#   Weapon Bundle's `Accessories/` folder) or `-` for a part with no art. The
#   art is LOCAL-ONLY: the ids are committed, the meshes are not.
#
# THE NUMBERS ARE DERIVED FROM THE NAME, BY ONE RULE PER KEYWORD, so any row can
# be checked by hand against the row above it. The doc gives no per-attachment
# numbers at all -- only the struct and its example comments (1.05 damage, 1.15
# range, 0.85 recoil, +25 ms ADS, 0.98 move, 1.20 velocity) -- so inventing 530
# hand-tuned rows would have been 530 numbers nobody could check. The keyword
# rules, in the order they compose:
#
#   suppressor/moderator/silencer  loudness x0.35, recoil x0.92, velocity x0.95,
#                                  range x0.92, ADS +30 ms          [art suppressor]
#   flash hider/blast shield       loudness x0.85, recoil x0.95     [art suppressor]
#   compensator/brake/choke        recoil x0.82, loudness x1.10     [art suppressor]
#   breaching                      damage x1.08, recoil x1.05
#   long/heavy/match barrel        range x1.15, damage x1.03, velocity x1.10,
#                                  ADS +40 ms, move x0.97
#   short/CQB/sawed barrel         range x0.85, velocity x0.90, ADS -35 ms, move x1.03
#   integrally suppressed barrel   loudness x0.45, velocity x0.95
#   lightweight/skeleton/carbon    move x1.02, ADS -15 ms
#   heavy/steel/brass/weighted     move x0.98, recoil x0.94, ADS +10 ms
#   an optic's magnification N     ADS +12N ms, range x(1 + 0.02N), recoil x0.98
#   thermal/digital/smart optic    ADS +40 ms, range x1.05
#   red dot/reflex/irons           ADS -10 ms                       [art sight]
#   a scope at 3x or more                                           [art scope]
#   heavy/padded/adjustable stock  recoil x0.85, move x0.97, ADS +15 ms
#   no stock/folding/wire          move x1.04, ADS -25 ms, recoil x1.12
#   bipod/handstop/barricade       recoil x0.80, move x0.98         [art vertgrip]
#   vertical/fore grip             recoil x0.88, ADS -10 ms         [art vertgrip]
#   an N-round magazine            mag override N
#   drum                           move x0.95, ADS +25 ms (60 rounds if unnamed)
#   flush/fast/speed/quick mag     ADS -20 ms
#   grip texture (rubber/G10/...)  recoil x0.94, ADS -8 ms
#   armour-piercing ammunition     damage x1.10, velocity x1.08, range x1.05
#   hollow point                   damage x1.15, range x0.88
#   subsonic                       loudness x0.60, velocity x0.75, damage x0.92
#   high-velocity/match/+P         velocity x1.15, range x1.08
#   incendiary/explosive/warhead   damage x1.20, range x0.95
#   frangible/rubber/less-lethal   damage x0.75, range x0.80
#   flechette                      damage x1.05, range x1.10
#   slug                           damage x1.10, range x1.30
#   a laser                        ADS -20 ms, recoil x0.97
#   a light/strobe                 ADS -10 ms
#   hair/binary/fast trigger       ADS -15 ms, recoil x1.05
#   heavy/polished/sealed action   recoil x0.92, ADS +10 ms
#   smart/guided fire control      ADS +25 ms, range x1.10
#
# Every product is then CLAMPED -- damage/range/recoil/velocity to [0.50, 2.00],
# move to [0.80, 1.20], loudness to [0.20, 2.00], the ADS delta to +/-150 ms --
# which is `inf_ecs::attachment::StatModifiers::clamped`, the same bound the
# parser applies to a hand-edited row.
#
# GENERATED, and byte-pinned. Edit the numbers here, not a copy of them.

