# **THE WEAPON REGISTRY** (wave WPN2a) -- 85 rows, read by
# `inf_ecs::weapon::WEAPON_REGISTRY_TOML` through `include_str!`.
#
# The rows are the user's research doc's own tables
# (`docs/Weapons-in-Rust-based-Game-Engine-GTA-Game.md`, sections 1-7 of the
# dataset): 10 pistols, 20 SMGs, 20 assault rifles, 10 DMRs, 10 snipers,
# 10 shotguns and 5 launchers. Its eight metrics reach this engine's doors as
# follows, and every derived number is derived by ONE rule per class so any row
# can be checked by hand:
#
#   torso damage  -> `damage_j`, at 20 J per hit point
#                    (`inf_ecs::weapon::JOULES_PER_HIT_POINT`: DEFAULT_VITALITY_J
#                    2000 J is a 100 HP body, so the scale is forced, not chosen
#                    -- and it reproduces island wave I6's own 600 J pistol).
#   head damage   -> `damage_curve.headshot_mult` = head / torso.
#   RPM           -> `rounds_per_minute`.
#   velocity      -> `muzzle_speed_mps`.
#   effective rng -> `damage_curve.effective_range_m`; `max_range_m` and
#                    `min_damage_frac` are the class rule below (the doc gives
#                    the pair only for its M4A1 example: 35 -> 80 m, 18 of 30,
#                    which is x2.3 and 0.6, and that is the AR row here).
#   recoil 1-10   -> `recoil.recoil_intensity`. WAVE WPN2b reads it; nothing does
#                    today, and it is authored now so the rows are written once.
#   ADS ms        -> `ads_time_ms`. Wave WPN2b, same sentence.
#   mag           -> `magazine`; `reserve` is four magazines (three for a
#                    launcher), which is a carry rule and not the doc's.
#   move speed    -> `move_speed_mult`, and this one has a consumer HERE:
#                    `inf_ecs::movement::settings_for` scales the target speed by
#                    it, so a sniper really is slower than a bare pair of hands.
#
# PER-CLASS RULES (threshold / range / drag / max-range factor / min fraction /
# spread / muzzle / reload / mass / report):
#
#   pistol    30 m  150 m  0.0008 /m  x2.5  0.50  1.20 deg  0.12 m  1.4 s  0.9 kg  220 m
#   smg       15 m  180 m  0.0007 /m  x2.5  0.50  1.60 deg  0.25 m  1.8 s  3.0 kg  240 m
#   ar        25 m  500 m  0.00035/m  x2.3  0.60  1.00 deg  0.45 m  2.0 s  3.6 kg  320 m
#   dmr       15 m  800 m  0.0003 /m  x2.0  0.70  0.40 deg  0.55 m  2.4 s  4.4 kg  420 m
#   sniper    10 m 1800 m  0.00022/m  x2.0  0.80  0.15 deg  0.65 m  3.0 s  6.5 kg  600 m
#   shotgun   10 m   80 m  0.0015 /m  x2.0  0.35  3.00 deg  0.50 m  3.2 s  3.4 kg  260 m
#   launcher   0 m  900 m  0.0006 /m  flat  1.00  0.50 deg  0.70 m  doc    7.0 kg  900 m
#
# The hitscan thresholds are the doc's own class table: "Pistols: pure hitscan
# (<30 m)", "SMGs: short hitscan threshold (15 m)", "Assault rifles: hybrid
# (25 m raycast, then 700-900 m/s projectile)", "Snipers: pure projectile or
# minimal hitscan (<10 m)", "Rocket launchers: physical entity projectile" --
# which is a threshold of zero, so a rocket is a body from the muzzle. A pistol
# whose 30 m threshold covers its own effective envelope is the doc's "pure
# hitscan" expressed as a CONSEQUENCE rather than as a second `ShotKind`; past
# it, at 40 m, a 9 mm round really does fly and really does drop.
#
# WHAT IS NOT MODELLED YET, said in the file rather than only in a report:
#
# * SHOTGUN PELLETS. `damage_j` here is the WHOLE PULL -- pellets x per-pellet
#   torso x 20 J -- delivered as one hit, because wave WPN2a has one ray per
#   trigger pull. WAVE WPN2d splits it: N rays off `shot_uniforms` inside
#   `cone_deg`, each carrying its own share, drawing on
#   `MAX_SHOT_RAYS_PER_STEP`. The per-pellet numbers are in the doc's table 6
#   and in the comment above each row.
# * LAUNCHER BLAST. `damage_j` is the doc's DIRECT impact damage only. The blast
#   radius, the falloff sweep and lock-on are wave WPN2d's; a rocket here flies,
#   drops and spends its direct damage on what it hits.
# * BURST FIRE. The engine has `automatic` and semi and no burst, so the doc's
#   three-round-burst rows (FAMAS F1, Type 95, CZ 75 Auto, TEC-9) are authored
#   AUTOMATIC at their listed RPM. A burst mode is wave WPN2b's fire-control
#   work; naming it here is cheaper than a reader wondering.
# * ATTACHMENTS. The doc's ~600 attachment rows are wave WPN2d's; nothing here
#   carries a slot.
#
# REAL NAMES: nominative use. See `WEAPON_REGISTRY_TOML`'s own doc comment for
# the recorded decision.
#
# GENERATED, and byte-pinned: `wpn2a_gate::the_registry_is_the_docs_own_tables`
# counts the rows per class and re-derives every damage figure from the doc's HP.
# Edit the numbers here, not a copy of them.

