[package]
name = "inf-ecs"
description = "ECS facade over bevy_ecs + bevy_reflect. The only crate that names bevy_ecs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `multi_threaded` enables bevy_ecs's parallel Schedule executor (P9.1a, §2.5).
# The feature is added here — inf-ecs is the sole crate naming bevy_ecs — while
# the version pin stays in [workspace.dependencies] (architecture rule 5).
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
# bevy_tasks (bevy_ecs's own task-pool crate) is named directly only to size and
# name the ECS `ComputeTaskPool` the multi_threaded executor runs on — see
# `schedule::init_ecs_task_pool` and its §2.5 two-pools doctrine note.
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
bevy_reflect = { workspace = true }
glam = { workspace = true }
inf-math = { workspace = true }
# The paged heightfield backing the `Terrain` component (P10.1). Ring-0 → Ring-0
# dep (inf-terrain never names bevy/reflect, so no cycle); the tile map is
# `#[reflect(ignore)]` on `Terrain`, exactly like the tilemap chunk store.
inf-terrain = { workspace = true }
# The water math a `WaterBody` describes (P20.4). Ring-0 → Ring-0: `inf-water`
# names only glam + inf-math, so there is no cycle. It is here for ONE thing —
# `hydro::TerrainFlow` turns the P19.1 flow map into the foam gain a river's
# frames carry, and the curve that does it lives once, in `inf_water::river`,
# rather than being spelt again in each of the two scene projectors.
inf-water = { workspace = true }
# The route substrate a crowd agent walks (NPC1c). Ring-0 → Ring-0: `inf-nav`
# names only glam + inf-math, so there is no cycle. It is here for ONE thing —
# `CrowdRoute` holds a `NavPath`, so an agent's place is an interpolation along a
# shared arc-length polyline rather than a straight line between two points, and
# a thousand agents sent down one street hold one copy of it. This crate does NOT
# name a road, a street or a building plan: the three producers of those live in
# `inf-gis`, `inf-editor-core` and `inf-pcg`, and each hands this crate a
# finished path.
inf-nav = { workspace = true }
# The pose pipeline a `.inf_sm` machine evaluates into (P24.1). Ring-0 → Ring-0:
# `inf-anim` names only glam/serde/thiserror/inf-asset, so there is no cycle.
#
# It is here for ONE thing, and it is the same argument that put `inf-terrain`
# and `inf-water` above: `pose::step_pose_evaluation` is the single fixed-step
# rule BOTH hosts call, so the editor preview and the shipped player cannot
# evaluate a character's pose differently. Written twice it would be two
# byte-identical loops, which is precisely the shape the deform doctrine
# replaced. Note this does NOT retire `components::SmRuntimeState`: the component
# must derive `Reflect` + serde and `inf_anim::SmRuntime` derives neither, so the
# POD mirror stays (and `pose::to_anim_runtime` is now its one conversion).
inf-anim = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
# Profiling spans (P15.1): the per-phase sim systems carry `trace`-level
# `#[tracing::instrument]` spans. At the default `info` filter they are disabled
# (near-zero cost — no subscriber records them); a Tracy run enables `trace` on
# this target to see per-phase timing. Spans never affect step results, so the
# §8 replay-determinism gate is untouched.
tracing = { workspace = true }
# P29.6: the locomotion camera's tunables live beside the level as `camera.toml`
# — a camera is not sim state and this wave has no schema budget, so its table is
# text an author owns rather than a scene field. Already a workspace dependency
# (`inf-asset` and the shipped player both carry it); it adds nothing to the tree.
# PARSING only: reading the path is the host's job and lives in
# `inf_player::input::load_camera_beside`, so this crate keeps its zero `std::fs`
# calls (P29.6 audit, A9).
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Byte-identity proof for the `#[serde(transparent)]` EntityRef (E-P1): the wire
# stream must match `Option<Uuid>`. Same bincode 2.x the scene serializer uses.
bincode = { workspace = true }
