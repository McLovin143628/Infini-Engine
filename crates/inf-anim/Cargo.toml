[package]
name = "inf-anim"
description = "Animation: skeletal runtime, clips, blend spaces, state machines."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
glam = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
inf-asset = { workspace = true }
# `pslerp` -- the BIT-PORTABLE quaternion arc (P24.2 audit M-SLERP). `Quat::slerp`
# calls `acos_approx` plus three `sin`s, and every blend in this crate feeds an
# evaluated pose that is folded into the sim's `state_bytes` and compared between
# the editor's Simulate and the shipped player. The P14 law says `std` trig is not
# bit-identical across targets, so it cannot be on that path. Ring 0 -> Ring 0,
# no cycle, and it adds no external crate (glam and nothing else).
inf-math = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Schema-ladder proofs for the `.inf_skel` wire (P24.1): the v1 shadow struct the
# v1 -> v2 refusal is measured against, and the byte-consumption shape pin that
# catches a tail field appended without a version bump. The same bincode 2.x
# `inf-asset` encodes with, and the same reason `inf-ecs` carries it as a
# dev-dependency. Test-only: the shipped crate still names only glam/serde/
# thiserror/inf-asset.
bincode = { workspace = true }
