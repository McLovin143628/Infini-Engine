[book]
title = "Infini Engine — Documentation"
description = "The user guide for Infini Engine, a Rust game engine with a Tauri + React editor."
authors = ["Infini Engine contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
# SCRIPT0: renamed with the product. GitHub redirects the old repository path
# permanently, so a reader who followed an old "Edit this page" link still lands.
git-repository-url = "https://github.com/McLovin143628/Infini-Engine"
edit-url-template = "https://github.com/McLovin143628/Infini-Engine/edit/main/docs/book/{path}"

[output.html.fold]
enable = true
level = 1
