[package]
name = "inf-player"
description = "Standalone game player: loads cooked packs and runs inf-runtime. Doubles as the PIE subprocess."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# A library target alongside the binary so the headless/determinism tests drive
# the real player logic in-process (call the lib entry) rather than only through
# the built exe (kept for the crash/exit-code path). The bin re-exports nothing;
# it is a thin `main()` over the lib.
name = "inf_player"
path = "src/lib.rs"

[[bin]]
name = "inf-player"
path = "src/main.rs"

[dependencies]
# ── the fixed-step loop + PIE protocol/toy world (Spike D seam, P9.4) ──
inf-runtime = { workspace = true }
# ── the real runtime the player drives (all Ring 0) ──
# The deterministic in-order job pool: the world-partition cell prefetch decodes
# a bounded batch through `parallel_map_ref` (P16.5), gated off wasm32 at the
# call site exactly as `inf_terrain::stream::load_tiles` does.
inf-core = { workspace = true }
inf-ecs = { workspace = true }
inf-physics = { workspace = true }
# Terrain heightfield projection + the PCG scatter runtime the player evaluates on
# load (a PcgVolume's instances are never persisted — recomputed from its graph).
inf-terrain = { workspace = true }
inf-pcg = { workspace = true }
inf-blueprint = { workspace = true }
# P12.3 audio: the runtime sim holds a long-lived `AudioEngine` host resource and
# drains the audio command queue (cooked scenes with AudioSources play on a device
# build, no-op consistently headless). Default features = the no-device path; the
# windowed player build opts into `cpal` for real output.
inf-audio = { workspace = true }
# P11.3 root motion: the pure root-delta extractor the runtime sim applies.
inf-anim = { workspace = true }
inf-input = { workspace = true }
inf-math = { workspace = true }
inf-render = { workspace = true }
# Virtualized geometry (P13.1b): the runtime resolves a mesh's cook-derived
# `.inf_vmesh` (meshlet DAG) and hands it to the renderer's GPU meshlet path.
inf-vgeom = { workspace = true }
# runtime .inf_lvl decode (P9.2) + the content pack reader (P9.2) — the player is
# the pack consumer. Both Ring 0.
inf-scene = { workspace = true }
inf-asset = { workspace = true }
# supporting vocabulary
glam = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Tracy profiler layer (P15.1) — pulled ONLY by the `tracy` feature (off by
# default); see [features] below and `docs/profiling.md`.
tracing-tracy = { workspace = true, optional = true }
# windowing + surface (Ring 2 only names these). wgpu comes in through inf-render
# too, but the player needs the type to build a surface from the winit window.
winit = { workspace = true }
wgpu = { workspace = true }
# The PIE window reports its native handle (HWND) so the editor can reparent it
# into the viewport slot (embedded PIE).
raw-window-handle = { workspace = true }

[features]
# Tracy live profiler capture (P15.1). OFF by default so a shipped player carries
# zero profiling cost and never links the vendored C++ Tracy client. Turn on with
# `cargo run -p inf-player --features tracy` and connect the Tracy viewer; the
# `render_frame` / `sim_step` spans (and, at `RUST_LOG=trace`, the per-pass /
# per-phase spans) stream live. See docs/profiling.md.
tracy = ["dep:tracing-tracy"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# Sandboxed WASM mods (P14.5) — native only; the browser (wasm32) player loads no
# native mods and must not pull wasmtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inf-wasm-host = { workspace = true }
# The shipped player's `SkeletalMesh` projection (the P18.3 follow-up). A skeletal
# mesh's BIND-SPACE geometry lives in its authoring `.inf_mesh` — the skin streams
# the cook ships beside the level through the `SkeletalMesh.mesh` dependency edge
# — and `inf_mesh::MeshAsset` is the only type that decodes it. Nothing else in
# the tree owns that payload, and hand-copying the struct is exactly the bincode
# positional-decode desync the schema LAW forbids, so the player depends on the
# crate that defines it (as `inf_editor_core::render_assets` does).
#
# NATIVE ONLY, and measured rather than assumed: `inf-mesh` pulls `meshopt`
# unconditionally, whose build script compiles meshoptimizer's C++ through `cc`.
# `cargo check --target wasm32-unknown-unknown -p inf-player` fails on it
# (`cc-rs: failed to find tool "clang"`) — the same reason `inf-vgeom` gates
# `meshopt` behind `cfg(not(target_arch = "wasm32"))`. The browser player
# therefore keeps drawing a `SkeletalMesh` as its placeholder, exactly as it did
# before this batch; every native target draws the real skinned geometry. See
# `skinned::SkinnedRegistry::build_skinned_geometry`.
inf-mesh = { workspace = true }

# ── Web target (P14.2): the wasm32 player runs in the browser over WebGPU. These
# deps only apply to `wasm32-unknown-unknown`; the desktop build is unchanged.
# Cargo features unify across the tree, so enabling `uuid`'s `js` randomness
# source here fixes every transitive `uuid` v4 user on wasm. `wgpu`'s `webgpu`
# backend + `winit`'s web canvas replace the native surface path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
wgpu = { workspace = true, features = ["webgpu"] }
# getrandom is a transitive dep (uuid/rand); force its browser backend on wasm.
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# wasm-bindgen entry point + browser bindings for `start_player`.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Response",
    "console",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
# std::time::Instant panics on wasm; web-time reads performance.now() so the
# fixed-step accumulator actually ticks in the browser.
web-time = "1"

# ── Android target (P14.1): winit needs an activity backend on Android. The
# `android-native-activity` feature pulls the `android-activity` NativeActivity
# glue that calls our `#[no_mangle] android_main` (see src/android.rs). Building
# the shared object requires the Android NDK (via `cargo-ndk`); see
# docs/android-player.md. Only applies to `*-linux-android` targets.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

[dev-dependencies]
inf-editor-core = { workspace = true }
# `biome_pcg` authors a real `scatter.merge` graph so the P19.3 multi-rule
# lowering rides the shipping pipeline in the gate, not only in its unit tests.
# Test-only: the shipped player never builds a graph, it only lowers one.
inf-graph = { workspace = true }
# The cook-and-run + export-and-run integration tests drive the real cook pipeline
# then boot the built player off its output (both Ring 2; dev-dep only — the
# shipped player never depends on the cook pipeline).
inf-packager = { workspace = true }
inf-project = { workspace = true }
# `vgeom_activation` cooks the SAME displaced-grid fixture the renderer's vgeom
# suites use; it lives once in `inf_vgeom::test_support` behind this test-only
# feature, with bit-portable trig (the P14 LAW). Dev-only — the shipped player's
# `inf-vgeom` is unchanged.
inf-vgeom = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
