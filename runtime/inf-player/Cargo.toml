[package]
name = "inf-player"
description = "Standalone game player: loads cooked packs and runs inf-runtime. Doubles as the PIE subprocess."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# A library target alongside the binary so the headless/determinism tests drive
# the real player logic in-process (call the lib entry) rather than only through
# the built exe (kept for the crash/exit-code path). The bin re-exports nothing;
# it is a thin `main()` over the lib.
name = "inf_player"
path = "src/lib.rs"

[[bin]]
name = "inf-player"
path = "src/main.rs"

[dependencies]
# ── the fixed-step loop + PIE protocol/toy world (Spike D seam, P9.4) ──
inf-runtime = { workspace = true }
# ── the real runtime the player drives (all Ring 0) ──
inf-ecs = { workspace = true }
inf-physics = { workspace = true }
# Terrain heightfield projection + the PCG scatter runtime the player evaluates on
# load (a PcgVolume's instances are never persisted — recomputed from its graph).
inf-terrain = { workspace = true }
inf-pcg = { workspace = true }
inf-blueprint = { workspace = true }
# P12.3 audio: the runtime sim holds a long-lived `AudioEngine` host resource and
# drains the audio command queue (cooked scenes with AudioSources play on a device
# build, no-op consistently headless). Default features = the no-device path; the
# windowed player build opts into `cpal` for real output.
inf-audio = { workspace = true }
# P11.3 root motion: the pure root-delta extractor the runtime sim applies.
inf-anim = { workspace = true }
inf-input = { workspace = true }
inf-math = { workspace = true }
inf-render = { workspace = true }
# Virtualized geometry (P13.1b): the runtime resolves a mesh's cook-derived
# `.inf_vmesh` (meshlet DAG) and hands it to the renderer's GPU meshlet path.
inf-vgeom = { workspace = true }
# runtime .inf_lvl decode (P9.2) + the content pack reader (P9.2) — the player is
# the pack consumer. Both Ring 0.
inf-scene = { workspace = true }
inf-asset = { workspace = true }
# supporting vocabulary
glam = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# windowing + surface (Ring 2 only names these). wgpu comes in through inf-render
# too, but the player needs the type to build a surface from the winit window.
winit = { workspace = true }
wgpu = { workspace = true }
# The PIE window reports its native handle (HWND) so the editor can reparent it
# into the viewport slot (embedded PIE).
raw-window-handle = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
inf-editor-core = { workspace = true }
# The cook-and-run + export-and-run integration tests drive the real cook pipeline
# then boot the built player off its output (both Ring 2; dev-dep only — the
# shipped player never depends on the cook pipeline).
inf-packager = { workspace = true }
inf-project = { workspace = true }
tempfile = { workspace = true }
