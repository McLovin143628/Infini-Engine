[package]
name = "inf-packager"
description = "Cook + bundle pipeline: asset packs, blueprint compilation, per-platform bundling."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The Ring-0 compute job system (§2.5, P7.0): the cook's per-asset CPU work
# (scene decode/re-encode, blueprint validate, vmesh DAG derivation, zstd) is
# fanned across the rayon pool via `inf_core::parallel_map` — a DETERMINISTIC
# in-order map, so the pack stays byte-identical (the P9.2 cook-determinism gate).
inf-core = { workspace = true }
inf-asset = { workspace = true }
inf-scene = { workspace = true }
inf-anim = { workspace = true }
inf-blueprint = { workspace = true }
# WASM mod cook target (P14.5): the SAME transpiler the compiled/dylib path uses,
# lowering a blueprint class → Rust for the generated mod crate.
inf-transpile = { workspace = true }
inf-project = { workspace = true }
# Cook stage: derive the virtualized-geometry `.inf_vmesh` from `.inf_mesh`.
inf-mesh = { workspace = true }
inf-vgeom = { workspace = true }
# Cook stage: structurally validate a `.inf_terrain`'s header + tile directory
# (P16.3). Header/directory only — the cook never decodes a tile.
inf-terrain = { workspace = true }
# P21.1: `.inf_voxel` payloads are structurally validated at cook (header +
# chunk directory only) before they ride through verbatim — the same discipline,
# and the same hazard, as `.inf_terrain` above.
inf-voxel = { workspace = true }
# P19.3: the cook reads a `.inf_pcg`'s authored graph to advise on `mask.image`
# nodes, whose texture the shipped/PIE players cannot resolve at load. Decode
# only — the cook never lowers or evaluates a graph.
inf-pcg = { workspace = true }
# P20.1: the cook reads a river's spline and asks `inf-water` for its arc-length
# elevation profile, so the downhill advisory and the picture the renderer draws
# come from the SAME frames rather than from two guesses. Pure math, no GPU.
inf-water = { workspace = true }
inf-math = { workspace = true }
# The river advisory reads `WaterBody` / `Spline` / `Transform` off a decoded
# level. Promoted from dev-dependencies at P20.1.
inf-ecs = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests inspect the cooked pack + decode a level/vmesh out of it.
# (`inf-ecs` became a real dependency at P20.1 — the river advisory reads
# `WaterBody`/`Spline` off a decoded level — so it is no longer listed here.)
# Forges the "bincode-framed .inf_terrain" corrupt-payload case — the exact
# mistake a generic asset writer would make.
bincode = { workspace = true }
inf-asset = { workspace = true }
inf-scene = { workspace = true }
inf-project = { workspace = true }
inf-mesh = { workspace = true }
inf-vgeom = { workspace = true }
# (`inf-math` became a real dependency at P20.1 — the river advisory maps the
# ECS spline interpolation onto `inf_math::spline`'s — so it is no longer listed
# here. The dense-grid cook fixture still uses its bit-portable trig, per the P14
# LAW: `std` sin/cos would make the derived meshlet DAG platform-dependent.)
