[package]
name = "inf-studio"
description = "Infinity Engine: the Tauri v2 editor application shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "inf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
inf-core = { workspace = true }
inf-editor-core = { workspace = true }
glam = { workspace = true }
inf-asset = { workspace = true }
inf-material = { workspace = true }
inf-project = { workspace = true }
inf-packager = { workspace = true }
inf-graph = { workspace = true }
inf-blueprint = { workspace = true }
inf-transpile = { workspace = true }
inf-viewport = { workspace = true }
# The PIE (play-in-editor) protocol types + tick rate (P9.4). Ring 2 spawns the
# player subprocess and speaks the local channel.
inf-runtime = { workspace = true }
raw-window-handle = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
