[package]
name = "inf-studio"
description = "Infinity Engine: the Tauri v2 editor application shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "inf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Tracy profiler layer (P15.1) — pulled ONLY by the `tracy` feature (off by
# default); see [features] below and docs/profiling.md.
tracing-tracy = { workspace = true, optional = true }
inf-core = { workspace = true }
inf-editor-core = { workspace = true }
glam = { workspace = true }
inf-asset = { workspace = true }
inf-audio = { workspace = true }
inf-material = { workspace = true }
inf-project = { workspace = true }
inf-packager = { workspace = true }
inf-graph = { workspace = true }
inf-ecs = { workspace = true }
inf-pcg = { workspace = true }
# The Terrain Import wizard commands read a produced `.inf_terrain` header back
# (grid config for the spawned component, tile counts for the done state) and
# name the lattice type the plan command computes with (P16.4a).
inf-terrain = { workspace = true }
inf-anim = { workspace = true }
inf-blueprint = { workspace = true }
inf-transpile = { workspace = true }
inf-viewport = { workspace = true }
# The PIE (play-in-editor) protocol types + tick rate (P9.4). Ring 2 spawns the
# player subprocess and speaks the local channel.
inf-runtime = { workspace = true }
raw-window-handle = { workspace = true }
uuid = { workspace = true }
portable-pty = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }

[features]
# Tracy live profiler capture for the editor (P15.1). OFF by default. Build with
# `cargo tauri dev --features tracy` (or `cargo build -p inf-studio --features
# tracy`) and connect the Tracy viewer to profile editor + embedded-viewport
# frames (`render_frame` spans, etc). See docs/profiling.md.
tracy = ["dep:tracing-tracy"]
