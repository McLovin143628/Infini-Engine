[package]
name = "inf-editor-core"
description = "Editor core (Tauri-free): project model, asset queries, undo/redo, thumbnailer, build orchestration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
inf-core = { workspace = true }
inf-runtime = { workspace = true }
inf-ecs = { workspace = true }
# Terrain sculpt strokes (P10.2b): the scene doc records `HeightDelta` undo steps
# and applies live brush strokes to the `Terrain` component's paged data.
inf-terrain = { workspace = true }
# P21.1: the sparse SDF chunk volumes that locally extend the heightfield.
inf-voxel = { workspace = true }
# The water math the P20.4 authoring tools ask (`hydro`): the lake fill preview,
# the river bed conflicts and the two climb checks the cook also runs. Ring-0
# math only — the tools call it, they do not re-implement it.
inf-water = { workspace = true }
inf-physics = { workspace = true }
inf-blueprint = { workspace = true }
inf-graph = { workspace = true }
# PCG scatter runtime: the samples generator authors a `.inf_pcg` graph for the
# terrain-demo gate scene (P10.6).
inf-pcg = { workspace = true }
inf-math = { workspace = true }
inf-asset = { workspace = true }
# The embedded DCC's half-edge mesh kernel (P23.3/P23.4): the Model Editor edits
# a `MeshSession` and previews it through `crate::dcc`. Ring 1 -> Ring 0.
inf-dcc = { workspace = true }
# The photogrammetry pipeline (P25.3). `inf-photo` is the SfM core (poses,
# intrinsics, the colour decoder the albedo bake re-reads photographs through);
# `inf-photo-gpu` is the dense stage and the texel-space bake half. The finish
# orchestrator lives here rather than in either of them because it needs
# `inf-dcc`'s unwrapper (a crate the shipped player must never link) and
# `AssetProject`'s writer, and neither is reachable from Ring 0.
inf-photo = { workspace = true }
inf-photo-gpu = { workspace = true }
inf-mesh = { workspace = true }
inf-material = { workspace = true }
# Audio depth (P12.3): the `.inf_audio` importer builds an `AudioAsset` payload,
# and Simulate holds a long-lived `AudioEngine` host resource + drains the audio
# command queue. Default features (no `cpal`) → the deterministic no-device path
# the editor/CI run; a device build opts into `cpal` at the Ring-2 layer.
inf-audio = { workspace = true }
inf-anim = { workspace = true }
inf-render = { workspace = true }
# P18.3: the editor derives `.inf_vmesh` meshlet DAGs itself (they stopped being
# cook-only) and indexes them for the interactive viewport's vgeom projection.
inf-vgeom = { workspace = true }
# P14.5 WASM modding: the editor loads/hot-reloads sandboxed mods in Simulate via
# a ModsSession over the same inf-wasm-host loader the player uses.
inf-wasm-host = { workspace = true }
# File-watching the mods dir for hot-reload (same crates the asset watcher uses).
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
uuid = { workspace = true }
bincode = { workspace = true }
toml = { workspace = true }
csv = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
