[package]
name = "inf-viewport"
description = "Native viewport host: per-OS child window embedding, input capture, surface lifecycle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tracing = { workspace = true }
# Camera controller is platform-neutral (headless-testable on any OS).
inf-math = { workspace = true }
glam = { workspace = true }
# The shared scene document (Phase 3): the viewport renders + picks against the
# same SceneDoc the editor edits — the single source of truth. Crosses the
# spawn boundary on every platform, so it's a general (not target) dependency.
inf-editor-core = { workspace = true }
inf-ecs = { workspace = true }
# Terrain heightfield + sculpt brushes (P10.2b): the host raycasts the cursor
# against the shared terrain and applies strokes. Pure Ring-0 (no GPU), so it's
# a general dependency even though only the windowed hosts drive sculpting.
inf-terrain = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
inf-render = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
inf-render = { workspace = true }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-core-foundation = { workspace = true }
