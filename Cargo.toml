[workspace]
resolver = "2"
members = [
    "crates/inf-core",
    "crates/inf-math",
    "crates/inf-platform",
    "crates/inf-ecs",
    "crates/inf-asset",
    "crates/inf-project",
    "crates/inf-scene",
    "crates/inf-render",
    "crates/inf-render-2d",
    "crates/inf-mesh",
    "crates/inf-vgeom",
    "crates/inf-material",
    "crates/inf-terrain",
    "crates/inf-pcg",
    "crates/inf-physics",
    "crates/inf-audio",
    "crates/inf-anim",
    "crates/inf-input",
    "crates/inf-graph",
    "crates/inf-blueprint",
    "crates/inf-transpile",
    "crates/inf-hotreload",
    "crates/inf-hotreload/test-plugins/v1",
    "crates/inf-hotreload/test-plugins/v2",
    "crates/inf-runtime",
    "editor/crates/inf-editor-core",
    "editor/crates/inf-viewport",
    "editor/studio/src-tauri",
    "runtime/inf-player",
    "runtime/inf-packager",
    "tools/inf-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/McLovin143628/Infinity-Engine"
authors = ["Infinity Engine contributors"]

[workspace.dependencies]
# ── shared, version-pinned once here; crates reference with { workspace = true } ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# default-features off: the dx12 backend currently mixes windows 0.62 (wgpu-hal)
# with windows 0.61 (unified into tauri's bucket by the resolver) and fails to
# compile. Vulkan-first on Windows until tauri reaches windows 0.62 — see the
# Spike A memo.
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "wgsl"] }
# naga standalone (same pin wgpu 30 uses, so one copy in the tree) — the WGSL
# front-end + validator let inf-material validate graph-generated WGSL at author
# time without pulling wgpu into Ring-0 material codegen (P7.2).
naga = { version = "30", features = ["wgsl-in"] }
raw-window-handle = "0.6"
# winit: the standalone player's (Ring 2) windowing/event loop (P9.3). The editor
# viewport embeds a *child* HWND/NSView via `inf-viewport` and does NOT use winit;
# only `inf-player` names it. 0.30 is the current ApplicationHandler-based API and
# uses raw-window-handle 0.6 (matching wgpu 30), so one rwh in the tree. The wgpu
# surface is created straight from the winit window — no per-OS surface code.
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
windows = "0.62"
glam = "0.33"
# ── ECS + reflection (Phase 3). bevy_ecs standalone is the archetype ECS;
# bevy_reflect powers the Details panel + scene serde. inf-ecs is the ONLY
# crate that names them (three-ring facade discipline). Pinned to a bevy
# release whose `glam` matches our workspace pin so reflected math types line
# up (no dual-glam in the tree).
bevy_ecs = "0.19"
# NB: NOT the `glam` feature — that pins glam 0.32 and would put a second glam
# in the tree alongside our 0.33 renderer pin. inf-ecs reflects transforms as
# f64 value types instead (see ecs::components), converting to glam for math.
bevy_reflect = "0.19"
# bevy_tasks pinned to the same 0.19 release as bevy_ecs (one copy in the tree).
# inf-ecs enables its `multi_threaded` feature to size/name the ECS ComputeTaskPool
# the parallel Schedule executor runs on (P9.1a, §2.5). Only inf-ecs names it.
bevy_tasks = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
# macOS viewport embedding (Spike A) — objc2 framework crates
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CATransaction"] }
objc2-core-foundation = "0.3"
# ── blueprint transpiler (Spike B) ──
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1"
# ── hot reload (Spike C) ──
libloading = "0.8"
# ── cooked snapshots / PIE protocol (Spike D) ──
bincode = { version = "2", features = ["serde"] }
# ── asset sidecars / .inf_lvl human-readable metadata (deterministic emit) ──
toml = "0.9"
# ── asset system (Phase 4) ──
# Content-directory watching → debounced `assets://changed` rescans. notify is
# CC0-1.0; the debouncer is MIT/Apache — both on the deny allow-list.
notify = "8"
notify-debouncer-full = "0.5"
# glTF mesh/scene import (pure Rust). meshopt (meshoptimizer via cc) does vertex-
# cache + overdraw + fetch optimization on imported meshes.
gltf = "1"
meshopt = "0.4"
# Texture decode/resize for PNG/JPEG/EXR/HDR import + mip generation. Curated
# feature set (no avif/webp) keeps the license surface on the allow-list and the
# build free of extra C toolchains. BCn block compression is hand-rolled in
# inf-material (BC7 via intel_tex_2 is a documented follow-up — its ISPC build
# is a cross-OS CI risk we decline to take on now).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
    "exr",
    "tga",
    "bmp",
] }
# CSV/JSON import for .inf_table data assets (P4.5).
csv = "1"
# ── IDE: embedded terminal (Phase 5.3) ──
# Cross-platform pseudo-terminal (ConPTY on Windows) for the terminal panel.
portable-pty = "0.8"
# ── IDE: file explorer + global search (Phase 5.4) ──
# gitignore-aware directory walking (file explorer, workspace search); regex
# for the search matcher.
ignore = "0.4"
regex = "1"
# ── concurrency: the Ring-0 compute job system (Phase 7.0, §2.5) ──
# rayon = the data-parallel worker pool (par_iter, join, scope). flume = MPMC
# channels for work hand-off/results; default-features off keeps it sync-only
# (no async/futures tree pulled into Ring 0). tokio stays in Ring 2 by rule.
rayon = "1"
flume = { version = "0.11", default-features = false }
# ── cook pipeline: asset-pack compression (Phase 9.2) ──
# zstd compresses the content-addressed `.inf_pack` payload blobs. The C core is
# built through zstd-sys/`cc` — the same cc toolchain `meshopt` already requires,
# and far more CI-portable than the ISPC path we declined for BC7. With a FIXED
# compression level and no timestamps/dictionary the output is deterministic, so
# cooking the same inputs twice is byte-identical (the P9.2 gate). The crate and
# its wrappers are MIT/Apache-2.0 (on the deny allow-list); the vendored C is
# BSD-3-Clause (also allowed).
zstd = "0.13"
# ── editor↔frontend shared types → committed TS bindings (CI drift-checked) ──
ts-rs = "12"
# test-only (dev-dependencies in member crates)
tempfile = "3"
png = "0.18"
# criterion = the workspace's bench harness (first used by the P7.0 job-pool
# scaling bench). default-features off drops the plotters/gnuplot HTML-report
# tree (and its heavier license surface); cargo_bench_support is all `harness =
# false` targets need.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# ── physics (Phase 8.3 / 9 / 12) ──
# rapier2d-f64: the 2D physics engine, f64 build. f64 (not the f32 default) keeps
# parity with the f64 world-coordinate doctrine (architecture rule 3) and avoids
# precision cliffs on large 2D worlds. This build's math types ARE glam 0.33
# (rapier → parry → glamx → glam 0.33, our workspace pin) so there is no second
# glam in the tree and DVec2 flows through the facade for free. `enhanced-
# determinism` (simba libm_force) makes stepping cross-platform bit-reproducible,
# the P12.2 replay-harness guarantee. The `parallel` (rayon) feature is DELIBERATELY
# left off so rapier does not spawn its own worker pool alongside inf-core's job
# system and so a step is order-independent of thread scheduling. Apache-2.0.
rapier2d-f64 = { version = "0.34", features = ["enhanced-determinism"] }
# rapier3d-f64: the 3D physics engine, same version family + rationale as rapier2d
# above. f64 keeps parity with the f64 world-coordinate doctrine; this build's math
# types are glam 0.33 too (rapier3d → parry3d-f64 → glamx → glam 0.33, our pin) so a
# rapier `Vector` IS a `glam::DVec3` and a `Rotation` a `glam::DQuat` — no second glam
# in the tree. `enhanced-determinism` gives cross-platform bit-reproducible stepping
# (the P12.2 replay guarantee); the `parallel` (rayon) feature is DELIBERATELY off so a
# step is order-independent of thread scheduling and rapier never spawns a pool beside
# inf-core's job system. Apache-2.0. (P9.1 3D baseline; deepened at P12.)
rapier3d-f64 = { version = "0.34", features = ["enhanced-determinism"] }
# kira: the audio engine (roadmap §7 — game-oriented: clocks, tweens, spatial; rodio is
# playback-only). default-features OFF: kira's defaults pull the `cpal` device backend
# (which links ALSA on Linux + libdbus via `cpal-realtime-dbus`) — a system-dep CI has
# no headers for. inf-audio therefore enables only symphonia decoders by default and puts
# the real cpal output backend behind its own non-default `cpal` feature (the desktop
# runtime opts in; CI + tests run the deterministic no-device path). MIT OR Apache-2.0;
# the symphonia decoder tree is MPL-2.0 (on the deny allow-list).
kira = { version = "0.12", default-features = false, features = [
    "symphonia",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
    "flac",
    "mp3",
] }
# gilrs: cross-platform gamepad input (roadmap P9.1 item 4). Pulled ONLY behind
# inf-input's non-default `gamepad` feature — it links platform HID/udev libs, so the
# pure action/axis-mapping core (the tested part) stays dependency-light and CI-safe;
# the desktop runtime enables `gamepad` for a real poller. MIT OR Apache-2.0.
gilrs = "0.11"

# intra-workspace crates
inf-core = { path = "crates/inf-core" }
inf-math = { path = "crates/inf-math" }
inf-platform = { path = "crates/inf-platform" }
inf-ecs = { path = "crates/inf-ecs" }
inf-asset = { path = "crates/inf-asset" }
inf-project = { path = "crates/inf-project" }
inf-scene = { path = "crates/inf-scene" }
inf-render = { path = "crates/inf-render" }
inf-render-2d = { path = "crates/inf-render-2d" }
inf-mesh = { path = "crates/inf-mesh" }
inf-vgeom = { path = "crates/inf-vgeom" }
inf-material = { path = "crates/inf-material" }
inf-terrain = { path = "crates/inf-terrain" }
inf-pcg = { path = "crates/inf-pcg" }
inf-physics = { path = "crates/inf-physics" }
inf-audio = { path = "crates/inf-audio" }
inf-anim = { path = "crates/inf-anim" }
inf-input = { path = "crates/inf-input" }
inf-graph = { path = "crates/inf-graph" }
inf-blueprint = { path = "crates/inf-blueprint" }
inf-transpile = { path = "crates/inf-transpile" }
# default-features off so plugin cdylibs get guest+abi only; host consumers
# (editor, runtime) add `features = ["host"]`.
inf-hotreload = { path = "crates/inf-hotreload", default-features = false }
inf-runtime = { path = "crates/inf-runtime" }
inf-editor-core = { path = "editor/crates/inf-editor-core" }
inf-viewport = { path = "editor/crates/inf-viewport" }
inf-packager = { path = "runtime/inf-packager" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
