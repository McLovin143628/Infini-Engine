[workspace]
resolver = "2"
members = [
    "crates/inf-core",
    "crates/inf-math",
    "crates/inf-platform",
    "crates/inf-ecs",
    "crates/inf-asset",
    "crates/inf-project",
    "crates/inf-scene",
    "crates/inf-render",
    "crates/inf-render-2d",
    "crates/inf-ui",
    "crates/inf-mesh",
    "crates/inf-vgeom",
    "crates/inf-dcc",
    "crates/inf-stream",
    "crates/inf-vt",
    "crates/inf-vsm",
    "crates/inf-material",
    "crates/inf-terrain",
    "crates/inf-voxel",
    "crates/inf-water",
    "crates/inf-nav",
    "crates/inf-gis",
    "crates/inf-island",
    "crates/inf-photo",
    "crates/inf-photo-gpu",
    "crates/inf-pcg",
    "crates/inf-physics",
    "crates/inf-audio",
    "crates/inf-anim",
    "crates/inf-input",
    "crates/inf-graph",
    "crates/inf-blueprint",
    "crates/inf-transpile",
    "crates/inf-script",
    "crates/inf-hotreload",
    "crates/inf-hotreload/test-plugins/v1",
    "crates/inf-hotreload/test-plugins/v2",
    "crates/inf-wasm-host",
    "crates/inf-mod",
    "crates/inf-net",
    "crates/inf-runtime",
    "platforms/inf-platform-null",
    "editor/crates/inf-editor-core",
    "editor/crates/inf-viewport",
    "editor/studio/src-tauri",
    "runtime/inf-player",
    "runtime/inf-packager",
    "tools/inf-cli",
    "tools/inf-import",
]
# The sample mods build to wasm32-unknown-unknown as standalone cdylib packages
# (a native cdylib build would fail to link the wasm-only host imports), so they
# declare their own `[workspace]` and are excluded from this one. The cook target
# + the inf-wasm-host end-to-end test build them for wasm32 out-of-band.
exclude = ["samples/mods"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# SCRIPT0: `Infinity-Engine` → `Infini-Engine` with the product name. GitHub
# serves a permanent redirect from a renamed repository's old path, for clones,
# fetches and the REST API alike, so CI and every existing checkout keep working
# whichever spelling they hold. The URL is updated because it should say the
# truth, not because anything breaks if it does not.
repository = "https://github.com/McLovin143628/Infini-Engine"
authors = ["Infini Engine contributors"]

[workspace.dependencies]
# ── shared, version-pinned once here; crates reference with { workspace = true } ──
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is NOT optional here (P19.3). serde_json's default parser is
# a fast path that can land **1 ULP** off the `f64` it was given, and JSON is not
# a cosmetic format in this engine: a `.inf_pcg` embeds its authored graph as a
# JSON string (`graph_json` — the model's `skip_serializing_if` fields are not
# bincode-safe), and the shipped/PIE player **re-lowers that graph** to get the
# document it scatters from. A param that came back a bit light would give the
# player a different `ScatterParams`/`ValueNoise` from the editor's, which surfaces
# as "the shipped world's foliage sits somewhere else" — the exact class of drift
# every gate in this repo exists to prevent. Found by `inf-pcg`'s round-trip
# property, not by a report.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tracing-tracy = the Tracy profiler subscriber layer (P15.1). Pulled ONLY behind
# the `tracy` feature on the Ring-2 apps (inf-studio / inf-player) — OFF by
# default. Because it is an optional, off-by-default dep, default builds and
# `cargo deny` (which resolves default features) never compile its vendored C++
# Tracy client (tracy-client-sys, MIT; the vendored Tracy is BSD-3-Clause — both
# on the deny allow-list). The doctrine (§2.5 / tech matrix): profiling spans
# exist UNCONDITIONALLY via `tracing`; this crate only adds a subscriber *layer*
# that records them, so a default (no-`tracy`) build carries zero profiling cost.
tracing-tracy = "0.11"
# default-features off: the dx12 backend currently mixes windows 0.62 (wgpu-hal)
# with windows 0.61 (unified into tauri's bucket by the resolver) and fails to
# compile. Vulkan-first on Windows until tauri reaches windows 0.62 — see the
# Spike A memo.
wgpu = { version = "30", default-features = false, features = ["vulkan", "metal", "wgsl"] }
# naga standalone (same pin wgpu 30 uses, so one copy in the tree) — the WGSL
# front-end + validator let inf-material validate graph-generated WGSL at author
# time without pulling wgpu into Ring-0 material codegen (P7.2).
naga = { version = "30", features = ["wgsl-in"] }
raw-window-handle = "0.6"
# winit: the standalone player's (Ring 2) windowing/event loop (P9.3). The editor
# viewport embeds a *child* HWND/NSView via `inf-viewport` and does NOT use winit;
# only `inf-player` names it. 0.30 is the current ApplicationHandler-based API and
# uses raw-window-handle 0.6 (matching wgpu 30), so one rwh in the tree. The wgpu
# surface is created straight from the winit window — no per-OS surface code.
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
windows = "0.62"
glam = "0.33"
# ── ECS + reflection (Phase 3). bevy_ecs standalone is the archetype ECS;
# bevy_reflect powers the Details panel + scene serde. inf-ecs is the ONLY
# crate that names them (three-ring facade discipline). Pinned to a bevy
# release whose `glam` matches our workspace pin so reflected math types line
# up (no dual-glam in the tree).
bevy_ecs = "0.19"
# NB: NOT the `glam` feature — that pins glam 0.32 and would put a second glam
# in the tree alongside our 0.33 renderer pin. inf-ecs reflects transforms as
# f64 value types instead (see ecs::components), converting to glam for math.
bevy_reflect = "0.19"
# bevy_tasks pinned to the same 0.19 release as bevy_ecs (one copy in the tree).
# inf-ecs enables its `multi_threaded` feature to size/name the ECS ComputeTaskPool
# the parallel Schedule executor runs on (P9.1a, §2.5). Only inf-ecs names it.
bevy_tasks = "0.19"
uuid = { version = "1", features = ["v4", "serde"] }
# macOS viewport embedding (Spike A) — objc2 framework crates
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "CATransaction"] }
objc2-core-foundation = "0.3"
# ── blueprint transpiler (Spike B) ──
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
prettyplease = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1"
# ── hot reload (Spike C) ──
libloading = "0.8"
# ── sandboxed WASM mod tier (Phase 14.5) ──
# wasmtime = the mod sandbox. Its whole tree (cranelift/wasmparser/regalloc2/
# pulley/cap-* off) is Apache-2.0 WITH LLVM-exception or MIT/Apache — on the deny
# allow-list. default-features off + a tight feature set: JIT compile (`cranelift`),
# `runtime`, `std`, `gc` (module validation expects the type machinery), the
# signal-based trap handler, and `wat` so tests build tiny modules from text. No
# component-model / async / WASI / gc: a mod is a plain core module behind our own
# i64/f64 host ABI. Only inf-wasm-host names it (three-ring facade discipline); it
# is NEVER built for wasm32 (the browser player does not load native mods).
wasmtime = { version = "47", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
    "wat",
] }
# wat = the WebAssembly-text → binary assembler (already in-tree via wasmtime's
# `wat` feature; Apache-2.0 WITH LLVM-exception, on the allow-list). inf-wasm-host
# re-exports a `wat_to_wasm` helper so tests across the workspace can build tiny
# real `.wasm` modules without a wasm toolchain.
wat = "1"
# ── cooked snapshots / PIE protocol (Spike D) ──
bincode = { version = "2", features = ["serde"] }
# ── asset sidecars / .inf_lvl human-readable metadata (deterministic emit) ──
toml = "0.9"
# ── asset system (Phase 4) ──
# Content-directory watching → debounced `assets://changed` rescans. notify is
# CC0-1.0; the debouncer is MIT/Apache — both on the deny allow-list.
notify = "8"
notify-debouncer-full = "0.5"
# glTF mesh/scene import (pure Rust). meshopt (meshoptimizer via cc) does vertex-
# cache + overdraw + fetch optimization on imported meshes.
gltf = "1"
meshopt = "0.4"
# Texture decode/resize for PNG/JPEG/EXR/HDR import + mip generation. Curated
# feature set (no avif/webp) keeps the license surface on the allow-list and the
# build free of extra C toolchains. BCn block compression is hand-rolled in
# inf-material (BC7 via intel_tex_2 is a documented follow-up — its ISPC build
# is a cross-OS CI risk we decline to take on now).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
    "exr",
    "tga",
    "bmp",
] }
# CSV/JSON import for .inf_table data assets (P4.5).
csv = "1"
# ── chunked heightmap decode (Phase 16.4) ───────────────────────────────────
# The huge-heightmap importer reads ROW BANDS, not whole images, so it names the
# two codecs directly instead of going through `image`'s DynamicImage:
#   exr  — OpenEXR: `block::read(..).decompress_sequential(..)` hands back one
#          decompressed scanline block at a time, which is the chunked seam a
#          16k² float-metre DEM needs. Already in the tree via `image`'s `exr`
#          feature (same 1.74 resolution), so this pins no new crate.
#          BSD-3-Clause — on the deny allow-list.
#   half — the `f16` sample type an EXR channel may use (in-tree via exr).
# (`png` is already pinned below beside the other test-time crates and is used by
# inf-terrain for `Reader::next_row` row-band decoding.)
exr = "1.74"
half = "2"
# ── IDE: embedded terminal (Phase 5.3) ──
# Cross-platform pseudo-terminal (ConPTY on Windows) for the terminal panel.
portable-pty = "0.8"
# ── IDE: file explorer + global search (Phase 5.4) ──
# gitignore-aware directory walking (file explorer, workspace search); regex
# for the search matcher.
ignore = "0.4"
regex = "1"
# ── concurrency: the Ring-0 compute job system (Phase 7.0, §2.5) ──
# rayon = the data-parallel worker pool (par_iter, join, scope). flume = MPMC
# channels for work hand-off/results; default-features off keeps it sync-only
# (no async/futures tree pulled into Ring 0). tokio stays in Ring 2 by rule.
rayon = "1"
flume = { version = "0.11", default-features = false }
# ── cook pipeline: asset-pack compression (Phase 9.2) ──
# zstd compresses the content-addressed `.ipack` payload blobs. The C core is
# built through zstd-sys/`cc` — the same cc toolchain `meshopt` already requires,
# and far more CI-portable than the ISPC path we declined for BC7. With a FIXED
# compression level and no timestamps/dictionary the output is deterministic, so
# cooking the same inputs twice is byte-identical (the P9.2 gate). The crate and
# its wrappers are MIT/Apache-2.0 (on the deny allow-list); the vendored C is
# BSD-3-Clause (also allowed).
zstd = "0.13"
# ── P14.2 web target ────────────────────────────────────────────────────────
# ruzstd: a PURE-RUST zstd DECODER, used by inf-asset ONLY on wasm32 (the browser
# player), where zstd-sys's C build does not target `wasm32-unknown-unknown`. The
# desktop/native build keeps the faster C `zstd` (encode + decode) unchanged — so
# cook determinism is untouched; wasm reads packs (decode-only) with ruzstd. MIT
# (on the deny allow-list). Decode-only ⇒ the browser never cooks/writes packs.
ruzstd = "0.8"
# ── per-BLOCK compression for the streaming containers (IASSET1) ────────────
# The pack compresses an authored entry WHOLE; a `.inf_terrain` / `.inf_voxel` /
# `.inf_part` is paged one tile/chunk/cell at a time and therefore shipped raw,
# at 100% of its bytes. `inf_asset::block` is the third option: compress each
# block independently, record the codec in the container's own directory, and
# decompress only the block a page-in asked for. Two candidates were measured
# against the already-shipped `zstd` on the real island's tiles (the bake-off
# table lives in `docs/memos/iasset1-block-compression.md`); both are PURE RUST,
# so unlike zstd (C natively, `ruzstd` in the browser) one implementation serves
# every target this engine ships to.
#
#   lz4_flex     — LZ4 block format. The fastest decode by a wide margin and the
#                  weakest ratio. MIT. The one NEW crate this wave pins.
#   miniz_oxide  — raw DEFLATE. **Already in the tree** (`png` → `flate2` →
#                  miniz_oxide 0.8.9, and `image` behind it), so this pin is a
#                  RECORD of a resolved version rather than a new supply-chain
#                  edge — the same reasoning `parry3d-f64` is pinned under.
#                  MIT OR Apache-2.0 OR Zlib.
#
# default-features off on both, and then the ones we DO want named back — because
# `default-features = false` is a blunt instrument and the thing it was reached for
# here is one feature of five.
#
# `lz4_flex`'s default set is `std + safe-encode + safe-decode + frame +
# checked-decode`. The only member this workspace does not want is **`frame`**,
# which pulls the LZ4 frame format and `twox-hash` for its checksum — the
# container already carries an xxh3-128 per entry. `safe-encode`/`safe-decode` are
# NOT optional here and turning them off was an accident of the blunt instrument:
# without `safe-decode` the crate compiles `block/decompress.rs`, which writes the
# output through a raw pointer (`PtrSink`), instead of `block/decompress_safe.rs`,
# which is `forbid(unsafe_code)`. `inf_asset::block::decode_block` runs **in the
# shipped player over a container the user downloaded**, and its `raw_len` bound is
# a bound on the CLAIM — the frame itself is still attacker-controlled. The safe
# decoder is the whole reason a pure-Rust codec was preferred to a C one, and the
# codec that actually ships (`COOK_TILE_CODEC` is `Zstd`) is not this one, so
# there is no measured cost being paid for it either. (`checked-decode` is inert
# in 0.14: no source file reads the cfg.)
#
# `miniz_oxide`'s default set is `with-alloc` and nothing else — `simd` is opt-in
# and was never on. The pin is spelled out rather than left implicit so the day
# its defaults grow, this workspace's DEFLATE bytes do not move with them.
lz4_flex = { version = "0.14", default-features = false, features = [
    "std",
    "safe-encode",
    "safe-decode",
] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# ── streaming: zero-copy pack reads (Phase 16.1) ────────────────────────────
# memmap2 maps a shipped `.ipack` into the address space so the runtime reads
# an uncompressed blob as a borrowed `&[u8]` slice (`PackReader::read_ref`) with
# no whole-file read and no copy — the substrate P16.3 terrain-tile streaming and
# P18.2 meshlet streaming page against. inf-asset uses it NATIVE-ONLY; wasm32 has
# no mmap and keeps the owned-bytes path. Already in the tree (winit's Wayland
# stack pulls the same 0.9), so this pins no new crate. MIT/Apache-2.0.
memmap2 = "0.9"
# ── editor↔frontend shared types → committed TS bindings (CI drift-checked) ──
ts-rs = "12"
# test-only (dev-dependencies in member crates)
tempfile = "3"
png = "0.18"
# criterion = the workspace's bench harness (first used by the P7.0 job-pool
# scaling bench). default-features off drops the plotters/gnuplot HTML-report
# tree (and its heavier license surface); cargo_bench_support is all `harness =
# false` targets need.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# ── physics (Phase 8.3 / 9 / 12) ──
# rapier2d-f64: the 2D physics engine, f64 build. f64 (not the f32 default) keeps
# parity with the f64 world-coordinate doctrine (architecture rule 3) and avoids
# precision cliffs on large 2D worlds. This build's math types ARE glam 0.33
# (rapier → parry → glamx → glam 0.33, our workspace pin) so there is no second
# glam in the tree and DVec2 flows through the facade for free. `enhanced-
# determinism` (simba libm_force) makes stepping cross-platform bit-reproducible,
# the P12.2 replay-harness guarantee. The `parallel` (rayon) feature is DELIBERATELY
# left off so rapier does not spawn its own worker pool alongside inf-core's job
# system and so a step is order-independent of thread scheduling. Apache-2.0.
rapier2d-f64 = { version = "0.34", features = ["enhanced-determinism"] }
# rapier3d-f64: the 3D physics engine, same version family + rationale as rapier2d
# above. f64 keeps parity with the f64 world-coordinate doctrine; this build's math
# types are glam 0.33 too (rapier3d → parry3d-f64 → glamx → glam 0.33, our pin) so a
# rapier `Vector` IS a `glam::DVec3` and a `Rotation` a `glam::DQuat` — no second glam
# in the tree. `enhanced-determinism` gives cross-platform bit-reproducible stepping
# (the P12.2 replay guarantee); the `parallel` (rayon) feature is DELIBERATELY off so a
# step is order-independent of thread scheduling and rapier never spawns a pool beside
# inf-core's job system. Apache-2.0. (P9.1 3D baseline; deepened at P12.)
rapier3d-f64 = { version = "0.34", features = ["enhanced-determinism"] }
# parry3d-f64: rapier's own collision-detection/geometry library, named DIRECTLY
# for the first time at P22.2 (the `ColliderShape3D::ConvexHull` variant a
# fracture chunk needs).
#
# **This pin adds nothing to the supply chain.** `parry3d-f64 0.29.0` is already
# in `Cargo.lock`, pulled by `rapier3d-f64 0.34`, and the version here is that
# exact resolved version — the pin is a *record*, not a new edge. Its whole value
# is that a future rapier bump which moves parry becomes a one-line, reviewable
# change in this file instead of a silent shift under a member crate. Same
# licence as rapier (Apache-2.0, on the `deny.toml` allow-list), same
# f64/glamx/glam-0.33 math types, so a `parry` `Vector` IS a `glam::DVec3`.
#
# **`inf-physics` is the ONLY crate allowed to name it** — the three-ring facade
# discipline that already keeps `bevy_ecs`/`bevy_reflect` inside `inf-ecs` and
# `wasmtime` inside `inf-wasm-host`. In particular the Ring-0 fracture pipeline
# (`inf_mesh::fracture`) computes its convex hulls with its own deterministic
# code and does NOT reach for parry: a cook-time geometry kernel and a runtime
# collision library have different determinism obligations, and giving the cook a
# second hull implementation to disagree with is the whole hazard.
parry3d-f64 = "0.29"
# kira: the audio engine (roadmap §7 — game-oriented: clocks, tweens, spatial; rodio is
# playback-only). default-features OFF: kira's defaults pull the `cpal` device backend
# (which links ALSA on Linux + libdbus via `cpal-realtime-dbus`) — a system-dep CI has
# no headers for. inf-audio therefore enables only symphonia decoders by default and puts
# the real cpal output backend behind its own non-default `cpal` feature (the desktop
# runtime opts in; CI + tests run the deterministic no-device path). MIT OR Apache-2.0;
# the symphonia decoder tree is MPL-2.0 (on the deny allow-list).
kira = { version = "0.12", default-features = false, features = [
    "symphonia",
    "wav",
    "pcm",
    "ogg",
    "vorbis",
    "flac",
    "mp3",
] }
# gilrs: cross-platform gamepad input (roadmap P9.1 item 4). Pulled ONLY behind
# inf-input's non-default `gamepad` feature — it links platform HID/udev libs, so the
# pure action/axis-mapping core (the tested part) stays dependency-light and CI-safe;
# the desktop runtime enables `gamepad` for a real poller. MIT OR Apache-2.0.
gilrs = "0.11"

# ── networking (Phase 14.3): the quinn QUIC transport, feature-gated ──────────
# These are pulled ONLY behind inf-net's non-default `quic` feature (which the
# Ring-2 apps + the integration test enable). tokio is a Ring-2-only dep by rule
# (§2.5): the sans-io protocol core in inf-net has no async runtime, so the
# deterministic sim never links tokio. Because `quic` is off in every default
# build, this whole tree also stays out of the default `cargo deny` graph.
#
# Crypto backend = ring (NOT the aws-lc-rs default): default-features off on both
# quinn and rustls, then the `ring` provider selected explicitly. This dodges the
# aws-lc-sys ISPC/asm C build (a cross-OS CI liability, same reasoning as the BC7
# intel_tex_2 decline). LICENSE NOTE: enabling `quic` in a cargo-deny run pulls
# `ring`, whose SPDX is expressed via a license-file (ISC/MIT/OpenSSL mix) that
# cargo-deny cannot classify without a `[licenses.clarify]` entry — deferred and
# documented in docs/memos/p14-console-hal-audit.md (deny stays green while quic
# is off by default). quinn/quinn-proto and rustls themselves are MIT/Apache-2.0/
# ISC (already on the allow-list).
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false }
# quinn datagrams take a `bytes::Bytes`; MIT/Apache, already transitive under the
# quic tree. Only pulled behind inf-net's `quic` feature.
bytes = "1"

# ── GIS / real-world data import (Wave G) ────────────────────────────────────
# The whole GIS surface is PURE RUST and host-only. `gdal`, `proj-sys`/`proj` and
# `geos` were all REFUSED by name: they bind native C libraries (GDAL alone drags
# PROJ + GEOS + libtiff + libcurl + OpenSSL + SQLite and ~40 more shared objects),
# our CI builds on three operating systems with no vcpkg/brew step, and `geos` is
# LGPL-2.1 — off the deny allow-list outright. This repo has already declined this
# exact class of dependency twice in writing (`intel_tex_2`'s ISPC build for BC7,
# `aws-lc-sys` for QUIC crypto); taking GDAL would reverse both rulings for a
# capability pure Rust serves. The named, bounded gaps that decision costs us are
# written down in docs/memos/wave-g-terrain-gis-disposition.md.
#
# Facade discipline (the rule that keeps `bevy_ecs` inside inf-ecs and `wasmtime`
# inside inf-wasm-host): exactly ONE crate names these — `inf-gis` — except `tiff`,
# which belongs beside `png`/`exr` in inf-terrain's row-at-a-time decoder seam.
#
#   tiff  — the GeoTIFF DEM reader. `read_chunk`/`chunk_dimensions` is the same
#           chunk-at-a-time seam `png::Reader::next_row` and exr's
#           `decompress_sequential` gave us, so the P16.4a "never hold more than
#           one tile row" memory bound survives the new format. default-features
#           off: `deflate` routes to flate2 (in-tree via png) and `lzw` to weezl;
#           the defaults would add zstd (pointless here) and image-webp (new and
#           pointless). NO LERC and NO JPEG2000 decoder exists in pure Rust — an
#           ArcGIS-produced LERC COG is refused BY NAME with the gdal_translate
#           remedy in the message, never with "unsupported compression". MIT.
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
# weezl — LZW, which is very common in DEM GeoTIFFs (transitive of tiff's `lzw`).
weezl = "0.1"
#   proj4rs — CRS → CRS transforms, a pure-Rust adaptation of proj4. TWO caveats
#           stated up front because both are user-visible: (1) it is proj4-STRING
#           driven, there is no `proj.db`, so "EPSG:32610" is resolved by our own
#           curated table (inf_gis::epsg) and every unsupported code is refused by
#           name rather than guessed; (2) it carries NO NTv2 datum grids, so datum
#           shifts are analytic only and old national datums (NAD27 and friends)
#           carry metre-class error — which we REPORT as a cook advisory rather
#           than hide, following GeoCanvas's divergence-warning precedent.
#           default-features off drops its two CLI binaries.
proj4rs = { version = "0.1", default-features = false }
#   shapefile — `.shp` geometry + `.dbf` attributes (via `dbase`). What the
#           government geoportals the owner's document names actually serve. MIT.
shapefile = "0.6"
#   geojson — the other half of that pair. It parses through `serde_json`, which
#           this workspace pins WITH the mandatory `float_roundtrip` feature (the
#           P19.3 law — the default parser can land 1 ULP off, and a GIS coordinate
#           is exactly where that shows up as a metre on the ground).
geojson = "0.24"
#   geo-types — the shared Point/LineString/Polygon vocabulary that lets geojson,
#           shapefile and proj4rs interoperate without three conversions. DATA
#           TYPES ONLY. The full `geo` algorithm crate is DECLINED: we need a
#           handful of predicates, not a library that pulls rstar + spade +
#           geographiclib-rs + robust behind our facade.
geo-types = "0.7"
#   spade  — 2D Delaunay, for triangulating GIS POLYGONS (parcels, footprints,
#           lake surfaces) into meshes. Already resolved in Cargo.lock as an
#           unpinned transitive of parry2d-f64/parry3d-f64, so it costs no new
#           license review — but naming it is a workspace pin and a facade ruling,
#           not a freebie. Deliberately NOT used for terrain: the engine's answer
#           to "flat ground should cost less" is the LOD pyramid plus the clipmap
#           rings, and a TIN would be a second terrain renderer beside the first
#           (see the disposition memo's CANNOT §1).
spade = "2.15"

# intra-workspace crates
inf-core = { path = "crates/inf-core" }
inf-math = { path = "crates/inf-math" }
inf-platform = { path = "crates/inf-platform" }
inf-ecs = { path = "crates/inf-ecs" }
inf-asset = { path = "crates/inf-asset" }
inf-project = { path = "crates/inf-project" }
inf-scene = { path = "crates/inf-scene" }
inf-render = { path = "crates/inf-render" }
inf-render-2d = { path = "crates/inf-render-2d" }
# inf-ui = the engine's IN-GAME ui layer (island wave I5). Ring 0, and
# dependency-light on purpose: glam + serde + toml + inf-render-2d + inf-input +
# inf-asset, every one already pinned above, so the shipped player's menu adds
# NO new external crate to the tree or to cargo-deny. It draws in SCREEN pixels
# through its own render node, which is why it takes `inf-render-2d` (for the
# instance shape and the built-in font) and NOT `inf-render` — the node lives in
# `inf-render`, exactly as the sprite node does, and for the same acyclicity
# reason that crate's own header gives.
inf-ui = { path = "crates/inf-ui" }
inf-mesh = { path = "crates/inf-mesh" }
inf-vgeom = { path = "crates/inf-vgeom" }
# inf-dcc = the embedded DCC's half-edge mesh kernel (P23.3). Ring 0, and
# dependency-light on purpose: inf-mesh + inf-math + glam + serde + bincode +
# thiserror, every one already pinned above, so the modelling kernel adds NO new
# external crate to the tree or to cargo-deny. It sits AFTER inf-vgeom in the
# member list because it depends on inf-mesh and nothing in Ring 0 depends on it
# yet — the Model Editor (P23.4, Ring 2) is its first consumer.
inf-dcc = { path = "crates/inf-dcc" }
# inf-stream = the ONE virtual streamer (P28.3): one stamp domain, one want
# pipeline, one budget arbiter, one readback ledger. Ring 0 on `inf-vt`'s exact
# terms — thiserror, nothing else — and it sits BEFORE all three residency
# crates in the member list because all three depend on it. It names none of
# them: what crosses the seam is a lane, a stamp, a byte count and a slot index,
# plus one trait the consumers implement over their own state. That direction is
# the whole architecture — a streamer that named `inf-vgeom` would drag the
# meshlet DAG into the virtual texture's dependency list, and the arbiter would
# stop being usable by a fourth consumer.
inf-stream = { path = "crates/inf-stream" }
# inf-vt = streaming virtual texturing's GPU-free half (P26.2): the virtual
# address space, the physical page pool and its residency. Ring 0, and the
# SHORTEST dependency list in the workspace — thiserror, nothing else,
# no wgpu and above all no `inf-material`. The direction is deliberate and
# load-bearing: `inf-material` depends on THIS crate (it re-exports `TileCoord`),
# which is what makes "the shipped player must not link an image decoder and a
# shader validator to sample a texture" a dependency cycle rather than a review
# question. It sits BEFORE inf-material in the member list for the same reason.
inf-vt = { path = "crates/inf-vt" }
# inf-vsm = virtual shadow mapping's GPU-free half (P27.1): the per-light virtual
# page space (clipmap levels for the sun, face quadtrees for point, one quadtree
# for spot), the physical page atlas geometry and the residency that allocates
# it. Ring 0 on `inf-vt`'s exact terms — thiserror, nothing else — and it does
# NOT name `inf-vt`: see that crate's docs for the measurement, and P28.3 for
# where the two brains merge.
inf-vsm = { path = "crates/inf-vsm" }
inf-material = { path = "crates/inf-material" }
inf-terrain = { path = "crates/inf-terrain" }
# inf-voxel = the sparse SDF chunk volumes that locally extend the heightfield
# (P21.1). Ring 0, and deliberately dependency-light: glam + serde + bincode +
# thiserror + inf-math + inf-asset, every one of them already pinned above, so
# volumetric terrain adds NO new external crate to the tree or to cargo-deny.
inf-voxel = { path = "crates/inf-voxel" }
inf-water = { path = "crates/inf-water" }
# inf-nav = the NPC1c route substrate: a deterministic weighted graph, Dijkstra
# answering a VALUE, and arc-length paths. Ring 0 and deliberately as thin as
# `inf-water` — glam + inf-math, both already pinned above — so navigation adds
# NO new external crate to the tree or to cargo-deny. It knows nothing about
# roads, settlements or buildings: each of those three exposes ITSELF as a
# `NavGraph`, which keeps "what a street is" in the crate that planned it.
inf-nav = { path = "crates/inf-nav" }
# inf-gis = the Wave-G GIS facade: the ONE crate naming proj4rs/shapefile/
# geojson/geo-types/spade. HOST-ONLY by rule — it runs at import and cook time
# and nothing in the shipped player links it, the same discipline `inf-mesh`
# applies to meshopt/gltf/image.
inf-gis = { path = "crates/inf-gis" }
# inf-island = the island GENERATOR (wave I7): a recipe, real-Earth elevation
# through Wave G's terrarium path, a designed coastline, and the stream / lake /
# biome layers derived from the result. HOST-ONLY by rule, for the same reason
# inf-gis is: it runs at authoring and build time and the shipped player links
# neither it nor anything it names. It adds NO external crate — every dependency
# it has is already pinned above, which is what makes "real Vancouver elevation"
# cost the tree nothing.
inf-island = { path = "crates/inf-island" }
# inf-photo = the photogrammetry SfM core (P25.1). Ring 0, and dependency-light
# on purpose: glam + serde + thiserror + image + inf-core + inf-math, every one
# already pinned above, so classical structure-from-motion adds NO new external
# crate to the tree or to cargo-deny. The linear algebra it needs beyond glam
# (symmetric Jacobi eigen, 3x3 SVD, LDL^T) is hand-rolled and unit-tested rather
# than pulled from nalgebra — see `inf_photo::linalg`.
inf-photo = { path = "crates/inf-photo" }
# inf-photo-gpu = the photogrammetry DENSE stage (P25.2): plane-sweep depth maps
# with a CPU reference and a WGSL mirror, and TSDF fusion that writes into
# `inf-voxel` and extracts through the mesher that is already there. Ring 0 —
# `wgpu` is legal in Ring 0 (inf-render is the precedent), Tauri is not. It adds
# NO new external crate: inf-photo + inf-voxel + inf-render + inf-core + wgpu +
# glam + bytemuck + thiserror are all pinned above already. It is a LEAF: nothing
# depends on it yet, and P25.3's finish pipeline is its first consumer.
inf-photo-gpu = { path = "crates/inf-photo-gpu" }
inf-pcg = { path = "crates/inf-pcg" }
inf-physics = { path = "crates/inf-physics" }
inf-audio = { path = "crates/inf-audio" }
inf-anim = { path = "crates/inf-anim" }
inf-input = { path = "crates/inf-input" }
inf-graph = { path = "crates/inf-graph" }
inf-blueprint = { path = "crates/inf-blueprint" }
inf-transpile = { path = "crates/inf-transpile" }
inf-script = { path = "crates/inf-script" }
# default-features off so plugin cdylibs get guest+abi only; host consumers
# (editor, runtime) add `features = ["host"]`.
inf-hotreload = { path = "crates/inf-hotreload", default-features = false }
inf-wasm-host = { path = "crates/inf-wasm-host" }
inf-mod = { path = "crates/inf-mod" }
inf-net = { path = "crates/inf-net" }
inf-platform-null = { path = "platforms/inf-platform-null" }
inf-runtime = { path = "crates/inf-runtime" }
inf-editor-core = { path = "editor/crates/inf-editor-core" }
inf-viewport = { path = "editor/crates/inf-viewport" }
inf-packager = { path = "runtime/inf-packager" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
# L7.L2 — build-machine paths must not reach a shipped crash report.
#
# The compile-time half of this is `trim-paths = "all"` (Cargo's supported
# spelling of `--remap-path-prefix`), which is **not stabilized in cargo 1.97**,
# the toolchain this workspace builds with — adding it here makes the manifest
# unparseable, so it is written down rather than set. The runtime half IS in
# place and does not depend on how the binary was built:
# `inf_player::log::sanitize_location` strips absolute paths out of
# `CrashReport.location` before the report is written. Turn this line on the day
# the pin moves past cargo's stabilization:
#   trim-paths = "all"
