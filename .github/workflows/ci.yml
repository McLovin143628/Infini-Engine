name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # `-A clippy::chunks_exact_to_as_chunks`: rustc 1.98 shipped this lint on
  # 2026-08-20 and CI rides stable while the local toolchain is 1.97, where the
  # lint does not exist and a rewrite cannot be verified to zero. The workspace
  # has 104 constant-size `chunks_exact` sites; chasing a lint only CI can run
  # is the one-platform-bounds law wearing a toolchain face. RETIREMENT: when
  # the local toolchain reaches 1.98, land the `as_chunks::<N>()` pass (the
  # target API is stable since 1.88, so the rewrite is bi-compatible) and drop
  # this flag in the same commit.
  RUSTFLAGS: "-D warnings -A clippy::chunks_exact_to_as_chunks"
  # The dependency tree (tauri + wgpu + bevy + the Phase 4 gltf/image/meshopt/exr
  # importers) makes full debuginfo archives large enough to exhaust the
  # ubuntu runner's disk. Line-tables keep panic locations while cutting the
  # bulk of the artifact size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          # Reclaim ~25 GB of preinstalled toolchains the build never uses, so
          # the large debug artifacts of the tauri/wgpu/bevy/importer tree fit.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo nextest run --workspace

      - name: Doctests (nextest does not run them)
        run: cargo test --workspace --doc

      # P28.5 — `cargo doc` reached no CI leg, which is why rustdoc warnings
      # accumulated: rustdoc reports things clippy does not (unresolved
      # intra-doc links, public docs pointing at private items), and this repo
      # has fixed several of them by hand, in an auditor's habit rather than in
      # the workflow. The P28.3 audit fixed four; the P28.4 audit found seventy
      # standing at sixty locations across five crates and routed the CI step
      # here.
      #
      # A RATCHET and not `-D warnings`, deliberately: the standing warnings are
      # the repair campaign's inventory and not this step's to clear, so the
      # step freezes the inventory and fails on a NEW one. Re-pinning the
      # ceiling downward as the campaign clears them is the point; re-pinning it
      # upward is a decision somebody has to write down.
      #
      # The ceiling is a **measurement** (2026-08-14, Windows, whole workspace).
      # A platform whose `#[cfg]` set differs may come in above or below it, and
      # if it does the step goes red and the fix is a deliberate one-line
      # re-pin — which is what a ratchet is for (the P15 budget-ratchet
      # doctrine).
      - name: Rustdoc ratchet (cargo doc reaches a CI leg)
        shell: bash
        env:
          RUSTDOC_WARNING_CEILING: 450
        run: |
          set -uo pipefail
          # P28.5 AUDIT — two ways this step passed without measuring anything.
          #
          # (1) `set -u -o pipefail` without `-e` does not abort on a failing
          #     pipeline, and the pipeline's status was never read. A `cargo doc`
          #     that FAILED outright therefore left an error log, `grep -c` found
          #     zero `warning:` lines in it, 0 <= the ceiling, and the step went
          #     GREEN. Reproduced with a controlled stand-in: the step printed
          #     "rustdoc warnings: 0 (ceiling 450)" and exited 0 on a `cargo doc`
          #     that exited 101. The one CI leg added to make rustdoc failures
          #     visible was green on the loudest rustdoc failure there is.
          #
          # (2) Same shape, quieter: this job restores a cargo cache
          #     (Swatinem/rust-cache), and a `cargo doc` that recompiles nothing
          #     re-emits nothing. Zero warnings out of a no-op is indistinguishable
          #     from zero warnings out of a clean tree, and the ratchet would
          #     freeze an inventory it never counted.
          #
          # So the status is checked, and the run must show evidence it ran. The
          # floor is on `Documenting` lines and NOT on the warning count, because
          # the repair campaign is meant to drive that count to zero and must not
          # break this step when it succeeds.
          # The restored cargo cache (Swatinem) carries target/doc, which makes
          # `cargo doc` a warm no-op — exactly the vacuous pass the guard below
          # refuses, and how this step's first CI run went red on all three legs
          # while the code was green. Cleaning ONLY the doc output forces every
          # workspace crate to re-document (deps' rmeta stays cached), so the
          # count below is a count of the whole tree, every run.
          cargo clean --doc
          # The workflow sets CARGO_TERM_COLOR=always, which wraps every cargo
          # status line in ANSI escapes — both greps below then count ZERO
          # ("Documenting" and "warning:" never match at line start), and the
          # anti-vacuity guard is all that stood between this step and a green
          # run whose counted number was a count of colored nothing. Twice now
          # the guard fired for a defect in this step's own environment; the
          # greps need bytes, not colors.
          if ! CARGO_TERM_COLOR=never cargo doc --no-deps --workspace 2>&1 | tee /tmp/rustdoc.log; then
            echo "::error::cargo doc FAILED. A ratchet over rustdoc warnings cannot count them if rustdoc did not finish."
            exit 1
          fi
          documented=$(grep -c '^ *Documenting ' /tmp/rustdoc.log || true)
          if [ "$documented" -eq 0 ]; then
            echo "::error::cargo doc documented no crate, so the warning count below is a count of nothing."
            echo "A cached no-op emits no warnings and would pass this ratchet vacuously."
            exit 1
          fi
          n=$(grep -c '^warning: ' /tmp/rustdoc.log || true)
          echo "rustdoc warnings: $n (ceiling ${RUSTDOC_WARNING_CEILING}) over $documented documented crates"
          if [ "$n" -gt "${RUSTDOC_WARNING_CEILING}" ]; then
            echo "::error::rustdoc warnings rose to $n, above the pinned ceiling of ${RUSTDOC_WARNING_CEILING}."
            echo "The new ones are in the log above. Fix them, or re-pin the ceiling deliberately."
            grep -n '^warning: ' /tmp/rustdoc.log | head -40
            exit 1
          fi

      - name: Cook-and-run smoke (§8)
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          # Build the CLI + player once (debug; reuses this job's target dir/cache).
          cargo build -p inf-cli -p inf-player
          # THE REAL FIRST-RUN PATH (island phase, IB-7). This used to hand-write
          # an inf.toml and copy a committed sample into Content/ — which is why
          # CI stayed green through the whole period in which all four `inf new`
          # templates produced a project `inf cook` refused. `inf new` is the
          # first command anyone runs; it is now the first command this runs.
          rm -rf ci-first-run
          mkdir -p ci-first-run
          # "<project name>:<template slug>" — the names avoid '.' because the
          # scaffold sanitizes it out of the directory name (hybrid-2.5d would
          # land in hybrid-2-5d and the cook path below would miss it).
          for pair in Blank:blank-3d Platformer:2d-platformer FirstPerson:first-person Hybrid:hybrid-2.5d; do
            name="${pair%%:*}"
            slug="${pair##*:}"
            "./target/debug/inf$EXE" new "$name" --template "$slug" --dir ci-first-run
            "./target/debug/inf$EXE" cook --project "ci-first-run/$name" --out "ci-first-run/$name/Build"
            "./target/debug/inf-player$EXE" --pack "ci-first-run/$name/Build" --headless --run-frames 300 --assert-exit
          done
          rm -rf ci-first-run

  wasm-check:
    name: Web player (wasm32) + Android (best-effort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (keep the Android NDK)
        run: |
          # Reclaim space but KEEP /usr/local/lib/android — the Android NDK the
          # best-effort cross-check below needs.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # The real gate (P14.2): the standalone player must cross-compile for the
      # browser's WebGPU target. getrandom needs its wasm backend selected.
      - name: Web player — cargo check (wasm32 + WebGPU)
        env:
          RUSTFLAGS: '-D warnings --cfg getrandom_backend="wasm_js"'
        run: cargo check --target wasm32-unknown-unknown -p inf-player

      # Best-effort (P14.1): the Android player's cfg(target_os="android") paths.
      # A plain `cargo check` cannot compile the C deps (zstd-sys/meshopt) without
      # the NDK's clang; cargo-ndk wires the NDK toolchain (the runner preinstalls
      # it). NON-BLOCKING — Android's real proof is a device build (docs/android-player.md).
      - name: Android player — cargo-ndk check (best-effort, non-blocking)
        continue-on-error: true
        run: |
          cargo install cargo-ndk --locked || { echo "cargo-ndk unavailable — skipping"; exit 0; }
          cargo ndk -t arm64-v8a check -p inf-player \
            || echo "Android check failed (NDK env unavailable) — non-blocking."

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/studio/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-binstall-style prebuilt install of mdBook — no compile, ~seconds.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Build the docs site
        run: mdbook build docs/book
      # The rendered site lands in docs/book/book (gitignored); publishing it to
      # GitHub Pages / a docs host is an ops step (see docs/release-channels.md).

  bindings-drift:
    name: TS bindings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate bindings from Rust types
        run: cargo test -p inf-editor-core --test bindings
      - name: Committed bindings must match the Rust types
        run: |
          git diff --exit-code -- editor/studio/src/bindings
          untracked="$(git ls-files --others --exclude-standard editor/studio/src/bindings)"
          if [ -n "$untracked" ]; then
            echo "bindings exported but not committed:"; echo "$untracked"; exit 1
          fi
