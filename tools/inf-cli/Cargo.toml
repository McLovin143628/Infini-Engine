[package]
name = "inf-cli"
description = "Infinity Engine CLI: inf new / inf cook / inf bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "inf"
path = "src/main.rs"

[dependencies]
inf-asset = { workspace = true }
inf-blueprint = { workspace = true }
inf-packager = { workspace = true }
inf-project = { workspace = true }
# IB-3: `inf gis` is the headless half of the import door. It links the Ring-0
# import module and NOTHING else — every decision the wizard makes is in there,
# so the two front ends cannot drift. `inf-scene` is the decode-only level
# reader the shipped player uses, here to read a level's geo-anchor without the
# CLI linking an editor crate (and its wgpu), which is the same reason
# `inf-project` exists.
inf-gis = { workspace = true }
# I7: `inf island` is the island generator's front end, and it links the Ring-0
# crate and NOTHING else — every decision (which tiles, where they cache, what
# the carve does, where a road may climb) is in `inf-island`, so this binary and
# a future editor wizard cannot drift. The one thing that is NOT in Ring 0 is the
# network transfer, deliberately: the engine makes no HTTP call, and this
# subcommand shells out to `curl` the way `commands/git.rs` shells out to `git`.
inf-island = { workspace = true }
inf-math = { workspace = true }
inf-scene = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
